<!DOCTYPE html>
<!--
  MedGym Scenario: Doctor Prescription — Rx Module (SmartCare-style)

  REAL-WORLD REFERENCES:
  1. CalMHSA Specialty Mental Health Services Clinical Documentation User Guide
     — Prescription Support Services
  2. SmartCare EHR Rx module workflows
  3. NCPDP SCRIPT Standard for electronic prescriptions

  PAGE DEPTH (per manual):
  - Login / Search for Rx Module
  - Patient Search (name, DOB, ID)
  - Patient Summary Screen:
      A. Patient info (name, DOB, insurance, diagnosis)
      B. Preferred Pharmacies (up to 3, search/save)
      C. Medication List (current meds, print, change, re-order, discontinue)
      D. Allergies / Intolerances / Failed Trials
      E. Action bar: New Order, Patient Consent, Change Order, Re-Order, Medication History
  - New Medication Order Screen:
      Order section (Send to Pharmacy / Print Script, prescriber info, DEA#)
      Medication section (drug search, strength, dose, directions, days, qty, refills)
      Insert → Review list → Prescribe → Confirm → Submit
  - Add Medication (Prescribed Elsewhere)
  - Patient Consent (sign by prescriber + client)
  - Change Medication Order (modify dose/directions/days)
  - Re-Order Medication
  - Discontinue Medication (reason, letter method)
-->
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmartCare Rx — Prescription Management</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh;background:#f0f4f8;color:#212121}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left}
.hidden{display:none!important}
:root{
  --bg:#f0f4f8;--surface:#fff;
  --hdr:#1a3a5c;--hdr-t:#e3edf7;
  --pri:#2563a8;--pri-d:#1a3a5c;--pri-l:#3b82d6;
  --acc:#d97706;--suc:#16803c;--warn:#f59e0b;--err:#dc2626;
  --txt:#212121;--txt2:#616161;--txt3:#9e9e9e;
  --bdr:#c5cdd6;--bdr-l:#e2e8f0;
  --row-h:#eef4fb;
  --rad:6px;
  --font-mono:Consolas,'Courier New',monospace
}
/* Header */
.header{background:var(--hdr);color:var(--hdr-t);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.header .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.header .r{display:flex;align-items:center;gap:14px;font-size:11px}
.header .r .clk{font-family:var(--font-mono);font-size:12px}
/* Login */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a5c,#2563a8)}
.login-box{background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:40px 36px;width:420px}
.login-box .logo{text-align:center;margin-bottom:24px}
.login-box .logo .icon{font-size:48px;margin-bottom:8px}
.login-box .logo .title{font-size:22px;font-weight:700;color:var(--pri-d)}
.login-box .logo .sub{font-size:11px;color:var(--txt2);margin-top:4px}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:4px}
.fc{width:100%;padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rad);outline:none;font-size:13px;background:#fafcff}
.fc:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(37,99,168,.2)}
.err{color:var(--err);font-size:12px;margin-top:6px;display:none}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 16px;border:1px solid transparent;border-radius:var(--rad);font-size:12px;font-weight:600;transition:.15s}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d)}
.btn-s{background:var(--suc);color:#fff}.btn-s:hover{background:#12692f}
.btn-w{background:var(--warn);color:#fff}.btn-w:hover{background:#d97706}
.btn-d{background:var(--err);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-out{background:#fff;border:1px solid var(--bdr);color:var(--txt)}.btn-out:hover{background:var(--bg)}
.btn-sm{padding:4px 10px;font-size:11px}.btn-lg{padding:10px 24px;font-size:14px}.btn-block{width:100%}
/* Toast */
.toast-container{position:fixed;top:60px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:var(--rad);font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);animation:slideIn .3s ease;color:#fff}
.toast-success{background:var(--suc)}.toast-error{background:var(--err)}.toast-info{background:#0071bc}.toast-warn{background:var(--warn)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:8px;width:700px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{padding:14px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;background:var(--hdr);color:#fff;border-radius:8px 8px 0 0}
.modal-header .close-btn{background:none;border:none;color:rgba(255,255,255,.8);font-size:18px;cursor:pointer}
.modal-body{padding:20px}
/* App shell */
#app{display:flex;flex-direction:column;min-height:100vh}
.main-layout{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:220px;background:#fff;border-right:1px solid var(--bdr-l);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .shdr{padding:14px 16px;font-size:13px;font-weight:700;color:var(--pri-d);border-bottom:1px solid var(--bdr-l)}
.nav-item{padding:10px 16px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{background:var(--row-h);color:var(--txt)}
.nav-item.active{background:var(--row-h);color:var(--pri-d);border-left-color:var(--pri)}
.nav-item .badge{margin-left:auto;background:var(--acc);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
/* Content */
.content{flex:1;overflow-y:auto;padding:16px 20px}
/* Card */
.card{background:#fff;border:1px solid var(--bdr-l);border-radius:var(--rad);box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.card-h{padding:12px 16px;font-size:13px;font-weight:700;color:var(--pri-d);border-bottom:1px solid var(--bdr-l);display:flex;align-items:center;justify-content:space-between}
.card-b{padding:16px}
/* Table */
.dt{width:100%;font-size:12px}
.dt thead th{background:var(--row-h);color:var(--pri-d);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;border-bottom:2px solid var(--pri);white-space:nowrap}
.dt tbody tr{border-bottom:1px solid var(--bdr-l);transition:.15s}
.dt tbody tr:hover{background:var(--row-h)}
.dt tbody td{padding:7px 12px}
/* Status badges */
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
.st-active{background:#e8f5e9;color:#2e7d32}
.st-pending{background:#e3f2fd;color:#1565c0}
.st-discontinued{background:#fce4ec;color:#c62828}
.st-queued{background:#fff3e0;color:#e65100}
.st-consent-yes{background:#e8f5e9;color:#2e7d32}
.st-consent-no{background:#fff8e1;color:#f57f17}
.st-outside{background:#f3e5f5;color:#6a1b9a}
/* Patient banner */
.pt-banner{background:linear-gradient(135deg,#e3edf7,#f0f4f8);border:1px solid var(--bdr-l);border-radius:var(--rad);padding:14px 18px;margin-bottom:14px;display:flex;gap:24px;flex-wrap:wrap}
.pt-banner .sec{flex:1;min-width:180px}
.pt-banner .nm{font-size:16px;font-weight:700;color:var(--pri-d)}
.pt-banner .dt2{font-size:11px;color:var(--txt2);margin-top:2px}
.pt-banner .lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.pt-banner .val{font-size:12px;color:var(--txt);margin-top:2px}
/* Allergy */
.allergy-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin:2px;background:#fce4ec;color:#c62828;border:1px solid #ef9a9a}
.allergy-tag.intolerance{background:#fff8e1;color:#e65100;border-color:#ffcc80}
.allergy-tag.failed{background:#e8eaf6;color:#3949ab;border-color:#9fa8da}
/* Pharmacy card */
.pharm-card{background:#f8fafb;border:1px solid var(--bdr-l);border-radius:var(--rad);padding:10px 14px;font-size:12px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.pharm-card .rank{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
/* Search results */
.search-row{padding:10px 14px;border-bottom:1px solid var(--bdr-l);cursor:pointer;display:flex;align-items:center;gap:12px;font-size:12px;transition:.15s}
.search-row:hover{background:var(--row-h)}
.search-row input[type=radio]{width:14px;height:14px}
/* Drug interaction warning */
.dur{background:#fff8e1;border:1px solid #ffa000;border-radius:var(--rad);padding:12px 16px;margin-bottom:10px}
.dur .dur-t{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.dur .dur-d{font-size:11px;color:var(--txt2)}
.dur-crit{background:#fce4ec;border-color:#ef9a9a}
.dur-crit .dur-t{color:#c62828}
/* Consent */
.consent-doc{background:#fafcff;border:1px solid var(--bdr-l);border-radius:var(--rad);padding:20px;max-height:300px;overflow-y:auto;font-size:12px;line-height:1.8;margin-bottom:14px}
.sig-box{border:2px dashed var(--bdr);border-radius:var(--rad);padding:16px;text-align:center;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafcff;margin-bottom:10px}
.sig-box.signed{border-color:var(--suc);background:#f0fdf4}
.sig-box .sig-name{font-size:14px;font-weight:700;font-style:italic;color:var(--pri-d)}
.sig-box .sig-time{font-size:10px;color:var(--txt3)}
/* Flex utilities */
.flex{display:flex}.flex-col{flex-direction:column}.gap-sm{gap:6px}.gap-md{gap:12px}.gap-lg{gap:20px}
.ai-c{align-items:center}.jc-sb{justify-content:space-between}.jc-e{justify-content:flex-end}
.mt-sm{margin-top:6px}.mt-md{margin-top:12px}.mt-lg{margin-top:20px}
.mb-sm{margin-bottom:6px}.mb-md{margin-bottom:12px}
/* Status bar */
.status-bar{height:28px;background:#e2e8f0;border-top:1px solid var(--bdr-l);padding:0 16px;display:flex;align-items:center;font-size:10px;color:var(--txt3);gap:20px;flex-shrink:0}
/* Order form */
.order-section{background:#f8fafb;border:1px solid var(--bdr-l);border-radius:var(--rad);padding:16px;margin-bottom:12px}
.order-section .sec-title{font-size:12px;font-weight:700;color:var(--pri-d);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.form-row{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.form-row .fg{flex:1;min-width:120px;margin-bottom:0}
.form-row .fg.sm{max-width:100px;flex:0 0 100px}
.form-row .fg.md{max-width:160px;flex:0 0 160px}
.med-inserted{background:#f0fdf4;border:1px solid #a7f3d0;border-radius:var(--rad);padding:10px 14px;margin-bottom:8px;font-size:12px;display:flex;align-items:center;justify-content:space-between}
/* Checkbox in table */
.row-chk{width:16px;height:16px;cursor:pointer}
/* Discontinue X */
.disc-x{background:none;border:none;color:var(--err);font-weight:700;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}
.disc-x:hover{background:#fce4ec}
/* EHR top bar */
.ehr-top{background:linear-gradient(180deg,#0f2942,#1a3a5c);color:#e3edf7;padding:0;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ehr-top-row1{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.ehr-brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.ehr-brand .ic{font-size:22px}
.ehr-prescriber{display:flex;align-items:center;gap:14px;font-size:11px}
.ehr-prescriber .badge{background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:10px;font-weight:700;font-size:10px}
.ehr-tabs{display:flex;align-items:flex-end;padding:0 12px;gap:2px;background:#1a3a5c;overflow-x:auto;scrollbar-width:thin}
.ehr-tab{padding:7px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent;transition:.15s;white-space:nowrap}
.ehr-tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.ehr-tab.active{color:#1a3a5c;background:#f0f4f8;border-bottom-color:#d97706}
.ehr-tab .badge-tab{background:var(--err);color:#fff;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;margin-left:2px}
.ehr-tab .pill-pmp{background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;margin-left:2px}
.ss-mailbox-btn{position:relative;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.ss-mailbox-btn:hover{background:rgba(255,255,255,.16)}
.ss-mailbox-btn.has-pending{background:#d97706;border-color:#f59e0b}
.ss-mailbox-btn .ct{background:#fff;color:#d97706;font-weight:700;padding:0 6px;border-radius:8px;font-size:10px}
/* Demographics card */
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 18px;padding:14px 16px}
.demo-grid .demo-cell{font-size:11px}
.demo-grid .demo-cell .lbl{color:var(--txt3);text-transform:uppercase;font-weight:700;font-size:9.5px;letter-spacing:.5px}
.demo-grid .demo-cell .val{color:var(--txt);font-size:12px;margin-top:1px;font-weight:500}
.demo-grid .demo-cell .val.warn{color:var(--err);font-weight:700}
.demo-grid .demo-cell .val.ok{color:var(--suc);font-weight:600}
.alert-banner{padding:10px 14px;border-left:4px solid;border-radius:0 6px 6px 0;font-size:12px;margin-bottom:10px;background:#fff8e1}
.alert-banner.warn{border-color:#f59e0b}
.alert-banner.crit{border-color:var(--err);background:#fce4ec;color:#991b1b}
.alert-banner.info{border-color:#0071bc;background:#e3f2fd;color:#0d47a1}
/* CDS Panel */
.cds-panel{background:#fafcff;border:1px solid var(--bdr-l);border-left:4px solid var(--pri);border-radius:var(--rad);padding:12px 14px;margin:8px 0;font-size:11.5px}
.cds-panel .cds-h{font-weight:700;font-size:12px;color:var(--pri-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cds-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--bdr-l)}
.cds-row:last-child{border-bottom:none}
.cds-row .ic{width:18px;text-align:center}
.cds-row .lbl{flex:1;color:var(--txt2)}
.cds-row .val{font-weight:600}
.cds-row .val.ok{color:var(--suc)}
.cds-row .val.warn{color:var(--acc)}
.cds-row .val.crit{color:var(--err)}
.cds-row .val.info{color:var(--pri)}
/* Activity log */
.activity-row{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid var(--bdr-l);font-size:11.5px;align-items:flex-start}
.activity-row:last-child{border-bottom:none}
.activity-row .ts{font-family:var(--font-mono);font-size:10.5px;color:var(--txt3);width:130px;flex-shrink:0}
.activity-row .ev{font-weight:700;color:var(--pri-d);width:160px;flex-shrink:0}
.activity-row .det{flex:1;color:var(--txt)}
/* Pharmacy search results */
.ph-search-row{padding:10px 12px;border:1px solid var(--bdr-l);border-radius:var(--rad);margin-bottom:6px;font-size:12px;display:flex;align-items:center;gap:10px;background:#fafcff;cursor:pointer;transition:.15s}
.ph-search-row:hover{background:var(--row-h);border-color:var(--pri)}
.ph-search-row.selected{border-color:var(--pri);background:#e3edf7}
.ph-pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9.5px;font-weight:700;margin-right:4px}
.ph-pill.epcs{background:#dcfce7;color:#166534}
.ph-pill.no-epcs{background:#fee2e2;color:#991b1b}
.ph-pill.bh{background:#e0e7ff;color:#3730a3}
.ph-pill.mail{background:#fef3c7;color:#92400e}
.ph-pill.network{background:#fce7f3;color:#9d174d}
/* Tabs (sub-tabs in modules) */
.tabbar{display:flex;border-bottom:2px solid var(--bdr-l);margin-bottom:10px;gap:2px}
.tabbar .tabb{padding:7px 14px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent}
.tabbar .tabb:hover{color:var(--txt)}
.tabbar .tabb.active{color:var(--pri-d);border-bottom-color:var(--pri)}
/* Vital chip */
.v-chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid var(--bdr-l);border-radius:var(--rad);padding:8px 14px;min-width:80px}
.v-chip .v-lbl{font-size:9.5px;color:var(--txt3);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.v-chip .v-val{font-size:18px;font-weight:700;color:var(--pri-d);font-family:var(--font-mono)}
.v-chip .v-val.warn{color:var(--err)}
.v-chip .v-unit{font-size:9.5px;color:var(--txt3)}
/* Lab table */
.lab-tbl{font-size:11.5px;width:100%}
.lab-tbl td{padding:5px 10px;border-bottom:1px solid var(--bdr-l)}
.lab-tbl .flag-h{color:var(--err);font-weight:700}
.lab-tbl .flag-l{color:#0d47a1;font-weight:700}
/* Problem list */
.prob-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--bdr-l);font-size:12px}
.prob-row .icd{font-family:var(--font-mono);font-size:11px;background:#e3edf7;color:#1e3a5c;padding:2px 6px;border-radius:4px;font-weight:700}
.prob-row .pname{flex:1}
.prob-row .ptype{font-size:10px;color:var(--txt3);font-weight:600;text-transform:uppercase}
/* PMP / EPCS */
.pmp-result{padding:14px;background:#fff8e1;border-left:4px solid #f59e0b;border-radius:var(--rad);margin:10px 0;font-size:12px}
.pmp-result.clean{background:#f0fdf4;border-color:var(--suc)}
.pmp-result h4{font-size:12px;margin-bottom:6px;color:#92400e}
.pmp-result.clean h4{color:#166534}
.epcs-2fa{background:#1a3a5c;color:#e3edf7;border-radius:var(--rad);padding:24px;text-align:center}
.epcs-2fa input{font-size:24px;font-family:var(--font-mono);text-align:center;letter-spacing:8px;padding:14px;border:2px solid #2563a8;border-radius:var(--rad);width:240px;background:#0f2942;color:#fff}
/* Mini stats card */
.stats-card{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-radius:var(--rad);padding:14px 18px;flex:1}
.stats-card .stat-val{font-size:28px;font-weight:700;line-height:1.1}
.stats-card .stat-lbl{font-size:11px;opacity:.85;margin-top:2px}
/* Alert badges (status pills used in tables) */
.alert-badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.3px}
.alert-badge.ok{background:#d1fae5;color:#065f46}
.alert-badge.warn{background:#fef3c7;color:#92400e}
.alert-badge.crit{background:#fee2e2;color:#991b1b}
.alert-badge.info{background:#dbeafe;color:#1e40af}
/* Pharmacy capability pills */
.pill{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9.5px;font-weight:700;letter-spacing:.3px;margin-right:3px}
.pill.epcs{background:#d1fae5;color:#065f46}
.pill.no-epcs{background:#fee2e2;color:#991b1b}
.pill.bh{background:#ede9fe;color:#5b21b6}
.pill.mail{background:#dbeafe;color:#1e40af}
.pill.network{background:#fef3c7;color:#92400e}
/* Sub-module tabbar items used by Mailbox/H&P pages */

window._narrowSearch=function(){
  let last=(document.getElementById('srchLast').value||'').trim().toLowerCase();
  let first=(document.getElementById('srchFirst').value||'').trim().toLowerCase();
  let cid=(document.getElementById('srchId').value||'').trim().toUpperCase();
  let results=S.patients.filter(p=>{
    let parts=p.name.toLowerCase().split(' ');
    let pFirst=parts[0],pLast=parts.slice(1).join(' ');
    if(last&&!pLast.includes(last))return false;
    if(first&&!pFirst.includes(first))return false;
    if(cid&&!p.id.includes(cid))return false;
    return true;
  });
  let container=document.getElementById('searchResults');
  if(!results.length){container.innerHTML='<p style="color:var(--txt3);font-size:12px;margin-top:10px">No patients found. Try different search criteria.</p>';return}
  container.innerHTML=`<div class="card mt-sm"><div class="card-h">Search Results (${results.length})</div><div class="card-b" style="padding:0">
    ${results.map(p=>`<div class="search-row" onclick="window._selectPatient('${esc(p.id)}')">
      <div style="flex:1"><strong>${esc(p.name)}</strong><br><span style="color:var(--txt3);font-size:11px">${esc(p.id)} &middot; DOB: ${esc(p.dob)} &middot; ${esc(p.gender)}</span></div>
      <div style="font-size:11px;color:var(--txt2)">${esc(p.dx)}</div>
      <button class="btn btn-p btn-sm">Select</button>
    </div>`).join('')}
  </div></div>`;
};

  document.getElementById('srchLast').value='';document.getElementById('srchFirst').value='';document.getElementById('srchId').value='';

};

function renderAllergyTags(allergies,filter){
  let filtered=filter==='all'?allergies:allergies.filter(a=>a.type===filter);
  if(!filtered.length)return '<p style="color:var(--txt3);font-size:12px">No entries found.</p>';
  return filtered.map(a=>`<span class="allergy-tag ${a.type==='Intolerances'?'intolerance':a.type==='Failed Trials'?'failed':''}" title="${esc(a.type)}: ${esc(a.reaction)} (${esc(a.severity)})">
    ${a.type==='Allergies'?'🔴':a.type==='Intolerances'?'🟡':'🔵'} ${esc(a.substance)} — ${esc(a.reaction)}
  </span>`).join('');
}

window._approveRenewal=function(rid){
  let r=S.renewalRequests.find(x=>x.id===rid);if(!r)return;
  // Auto-create new prescription based on original
  let pid=r.patientId;
  if(!S.patientMeds[pid])S.patientMeds[pid]=[];
  let original=(S.patientMeds[pid]||[]).find(m=>m.id===r.originalRx);
  let nm={
    id:'MED-RNW-'+Date.now(),
    drug:original?original.drug:{name:r.drug,generic:r.drug,strengths:[],forms:['Tablet'],directions:[r.directions],category:'',schedule:r.controlled?'Schedule II':'Non-Controlled'},
    strength:original?original.strength:'',dose:original?original.dose:'1',unit:original?original.unit:'Tablet',
    directions:r.directions,daysSupply:30,qty:30,refills:original?original.refills:1,
    rxStart:today(),rxEnd:addDays(today(),30),status:'active',prescribed:true,
    sendToPharm:r.pharmacy,consent:original?original.consent:false,outside:false,renewalOf:r.id
  };
  S.patientMeds[pid].push(nm);
  r.status='approved';r.respondedAt=new Date().toISOString();
  if(!S.medHistory[pid])S.medHistory[pid]=[];
  S.medHistory[pid].push({drug:r.drug,action:'Renewal Approved',date:today(),reason:'Surescripts renewal '+r.id});
  S.prescribedThisSession.push({patientId:pid,drug:r.drug,type:'renewal'});
  toast('Renewal '+r.id+' approved and transmitted to pharmacy','success');
  render();
};

window._denyRenewal=function(rid){
  let r=S.renewalRequests.find(x=>x.id===rid);if(!r)return;
  showModal(`<div class="modal-header"><span>📨 Deny Renewal Request</span><button class="close-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="margin-bottom:12px">Denying renewal for <strong>${esc(r.drug)}</strong> (Request ${esc(r.id)}).</p>

    </div>
  </div>`);
};

window._confirmDenyRenewal=function(rid){
  let r=S.renewalRequests.find(x=>x.id===rid);if(!r)return;
  let reason=document.getElementById('denyReason').value;
  if(!reason){toast('Select a deny reason','error');return}

window._prescribeQueued=function(pid,idx){
  let q=(S.queuedOrders[pid]||[])[idx];if(!q)return;
  if(!S.patientMeds[pid])S.patientMeds[pid]=[];
  S.patientMeds[pid].push({
    id:'MED-'+Date.now(),drug:q.drug,strength:q.strength,dose:q.dose,unit:q.unit,
    directions:q.directions,daysSupply:q.days,qty:q.qty,refills:q.refills,
    rxStart:q.rxStart,rxEnd:q.rxEnd,status:'active',prescribed:true,
    sendToPharm:q.pharmacy||'',consent:false,outside:false
  });
  if(!S.medHistory[pid])S.medHistory[pid]=[];
  S.medHistory[pid].push({drug:q.drugName+' '+q.strength,action:'Prescribed (from Queue)',date:today(),reason:'Queued order activated'});
  S.prescribedThisSession.push({patientId:pid,drug:q.drugName,type:'queued'});
  S.queuedOrders[pid].splice(idx,1);
  toast(q.drugName+' prescribed from queue','success');render();
};

window._removeQueued=function(pid,idx){
  S.queuedOrders[pid].splice(idx,1);toast('Queued order removed','info');render();
};

window._confirmCancel=function(medId){
  let pid=S.selectedPatient;
  let med=(S.patientMeds[pid]||[]).find(m=>m.id===medId);if(!med)return;
  let reason=document.getElementById('cancelReason').value||'';
  S.cancelOrders.push({medId,patientId:pid,drug:med.drug.name,reason,sentAt:new Date().toISOString()});
  med.status='cancelled';

  S.medHistory[pid].push({drug:med.drug.name+' '+med.strength,action:'CancelRx Sent',date:today(),reason:reason||'Cancellation'});
  closeModal();toast('CancelRx transmitted to pharmacy','info');render();
};

/* Inline Clinical Decision Support — recomputed each time drug/strength changes */
window._updateCDS=function(){
  let panel=document.getElementById('cdsPanel');if(!panel||!selectedDrug)return;
  let d=selectedDrug;
  let pt=S.patients.find(p=>p.id===S.selectedPatient);if(!pt){panel.innerHTML='';return}
  let strength=(document.getElementById('drugStrength')||{}).value||'';
  let strengthMg=parseFloat((strength.match(/([\d.]+)\s*mg/)||[])[1]||'0');
  let dose=parseInt((document.getElementById('drugDose')||{}).value||'1')||1;
  let dirs=((document.getElementById('drugDirections')||{}).value||'').toLowerCase();
  let perDay=1;
  if(dirs.includes('twice daily')||dirs.includes('bid'))perDay=2;
  else if(dirs.includes('three times')||dirs.includes('tid'))perDay=3;
  else if(dirs.includes('every 6 hours'))perDay=4;
  let dailyMg=strengthMg*dose*perDay;
  let rows=[];
  // Formulary / coverage
  let tier=d.formularyTier||3;
  let copay=tier===1?'$5':tier===2?'$15':'$45';
  let pa=tier>=3?' (PA may be required)':'';
  rows.push(`<div class="cds-row info"><div class="cds-ic">💳</div><div class="cds-lbl">Formulary Tier ${tier} — estimated copay</div><div class="cds-val">${copay}${pa}</div></div>`);
  // Max daily dose
  if(d.maxDailyMg && dailyMg>0){
    if(dailyMg>d.maxDailyMg)rows.push(`<div class="cds-row crit"><div class="cds-ic">⚠️</div><div class="cds-lbl">Daily dose ${dailyMg} mg <strong>EXCEEDS</strong> max ${d.maxDailyMg} mg/day</div><div class="cds-val">OVER MAX</div></div>`);
    else if(dailyMg>d.maxDailyMg*0.75)rows.push(`<div class="cds-row warn"><div class="cds-ic">↑</div><div class="cds-lbl">Daily dose ${dailyMg} mg approaching max ${d.maxDailyMg} mg/day</div><div class="cds-val">${Math.round(dailyMg/d.maxDailyMg*100)}% MAX</div></div>`);
    else rows.push(`<div class="cds-row ok"><div class="cds-ic">✓</div><div class="cds-lbl">Daily dose ${dailyMg} mg of ${d.maxDailyMg} mg/day max</div><div class="cds-val">WITHIN RANGE</div></div>`);
  }
  // Renal
  if(d.renalAdj && pt.egfr<60)rows.push(`<div class="cds-row warn"><div class="cds-ic">🧈</div><div class="cds-lbl">Renal dose adjustment recommended (eGFR ${pt.egfr})</div><div class="cds-val">ADJUST</div></div>`);
  // Hepatic
  if(d.hepaticAdj && (pt.alt>40||pt.ast>40))rows.push(`<div class="cds-row warn"><div class="cds-ic">🤬</div><div class="cds-lbl">Hepatic adjustment advised (ALT ${pt.alt}, AST ${pt.ast})</div><div class="cds-val">ADJUST</div></div>`);
  // Pregnancy / childbearing
  if(pt.pregnant && (d.pregnancyCat==='D'||d.pregnancyCat==='X'))rows.push(`<div class="cds-row crit"><div class="cds-ic">🤰</div><div class="cds-lbl">Patient pregnant — Category ${d.pregnancyCat} (teratogenic)</div><div class="cds-val">CONTRA</div></div>`);
  else if(pt.childbearing && (d.pregnancyCat==='D'||d.pregnancyCat==='X'))rows.push(`<div class="cds-row warn"><div class="cds-ic">🤰</div><div class="cds-lbl">Childbearing potential — Category ${d.pregnancyCat}: verify pregnancy status & counsel</div><div class="cds-val">CAUTION</div></div>`);
  // Age (geriatric)
  let age=ageFromDOB(pt.dob);
  if(age>=65 && (d.category||'').toLowerCase().includes('benzodiazepine'))rows.push(`<div class="cds-row warn"><div class="cds-ic">👴</div><div class="cds-lbl">Beers Criteria: avoid benzodiazepines in adults ≥65 (fall risk)</div><div class="cds-val">BEERS</div></div>`);
  if(age<18 && d.schedule==='Schedule II')rows.push(`<div class="cds-row warn"><div class="cds-ic">🧒</div><div class="cds-lbl">Pediatric controlled-substance prescribing — weight-based dosing required</div><div class="cds-val">PEDS</div></div>`);
  // Black box
  if(d.blackBox)rows.push(`<div class="cds-row crit"><div class="cds-ic">☠️</div><div class="cds-lbl"><strong>Black Box:</strong> ${esc(d.blackBox.length>110?d.blackBox.slice(0,110)+'…':d.blackBox)}</div><div class="cds-val">BBW</div></div>`);
  // Lithium-specific monitoring
  if(d.generic && d.generic.toLowerCase().includes('lithium') && pt.lithiumLvl!=null)rows.push(`<div class="cds-row info"><div class="cds-ic">🧪</div><div class="cds-lbl">Most recent lithium level</div><div class="cds-val">${pt.lithiumLvl} mEq/L</div></div>`);
  // Controlled substance → PMP & EPCS
  if(d.schedule==='Schedule II'||d.schedule==='Schedule IV'){
    let q=(S.pmpQueries||[]).find(x=>x.patientId===pt.id && (Date.now()-new Date(x.ts).getTime())<24*60*60*1000);
    if(q)rows.push(`<div class="cds-row ok"><div class="cds-ic">🔍</div><div class="cds-lbl">PMP/CURES query on file (${q.ts.slice(0,10)}) — ${q.findings}</div><div class="cds-val">QUERIED</div></div>`);
    else rows.push(`<div class="cds-row warn"><div class="cds-ic">🔍</div><div class="cds-lbl">PMP/CURES query required (controlled substance) — <a href="#" onclick="event.preventDefault();window._runPMP()">Run query now</a></div><div class="cds-val">REQUIRED</div></div>`);
    if(d.schedule==='Schedule II')rows.push(`<div class="cds-row info"><div class="cds-ic">🔐</div><div class="cds-lbl">EPCS 2-factor authentication will be required at signing</div><div class="cds-val">EPCS</div></div>`);
  }
  // Drug-allergy duplicate (already handled at insert time, but show here too)
  let allergies=S.patientAllergies[pt.id]||[];
  let am=allergies.find(a=>d.name.toLowerCase().includes(a.substance.toLowerCase())||d.generic.toLowerCase().includes(a.substance.toLowerCase()));
  if(am)rows.push(`<div class="cds-row crit"><div class="cds-ic">🤚</div><div class="cds-lbl">Documented allergy: ${esc(am.substance)} (${esc(am.reaction)}, ${esc(am.severity)})</div><div class="cds-val">ALLERGY</div></div>`);
  // Render
  panel.innerHTML=`<div class="cds-panel"><div class="cds-h">🧠 Clinical Decision Support — ${esc(d.name)} ${esc(strength)} (${esc(d.schedule)})</div>${rows.join('')}</div>`;
};

window._calcQty=function(){
  let days=parseInt(document.getElementById('rxDays').value)||30;
  let dose=parseInt(document.getElementById('drugDose').value)||1;

  let perDay=1;
  if(dir.includes('twice daily')||dir.includes('bid'))perDay=2;

window._insertOrder=function(){
  if(!selectedDrug){toast('Please select a drug first','error');return}
  let strength=document.getElementById('drugStrength').value;
  let dose=document.getElementById('drugDose').value;
  let unit=document.getElementById('drugUnit').value;
  let directions=document.getElementById('drugDirections').value||document.getElementById('instrText').value;
  let days=parseInt(document.getElementById('rxDays').value)||30;
  let qty=parseInt(document.getElementById('rxQty').value)||30;
  let refills=parseInt(document.getElementById('rxRefills').value)||0;
  let rxStart=document.getElementById('rxStartDate').value||today();
  let rxEnd=document.getElementById('rxEndDate').value||addDays(rxStart,days);

  // Check for drug/allergy interaction
  let allergies=S.patientAllergies[S.selectedPatient]||[];
  let allergyMatch=allergies.find(a=>selectedDrug.name.toLowerCase().includes(a.substance.toLowerCase())||selectedDrug.generic.toLowerCase().includes(a.substance.toLowerCase()));
  // Check for drug/drug interaction with active meds (PDF1 §Drug/Allergy Interaction Warnings)
  let activeMeds=(S.patientMeds[S.selectedPatient]||[]).filter(m=>m.status==='active');
  let drugDrug=null;
  // Simple interaction matrix
  const DD_INTERACTIONS={
    'lithium':['ibuprofen','naproxen','aspirin','hydrochlorothiazide'],
    'sertraline':['lorazepam','clonazepam','tramadol','linezolid','maoi'],
    'fluoxetine':['lorazepam','clonazepam','tramadol','linezolid','maoi'],
    'lorazepam':['clonazepam','quetiapine','olanzapine','sertraline','fluoxetine'],
    'clonazepam':['lorazepam','quetiapine','olanzapine'],
    'quetiapine':['lorazepam','clonazepam','olanzapine'],
    'olanzapine':['lorazepam','clonazepam','quetiapine'],
    'methylphenidate':['maoi','tramadol']
  };
  let nGen=(selectedDrug.generic||'').toLowerCase();
  let nName=(selectedDrug.name||'').toLowerCase();
  for (let m of activeMeds){
    let mGen=(m.drug.generic||'').toLowerCase();
    let mName=(m.drug.name||'').toLowerCase();
    for (let key in DD_INTERACTIONS){
      if ((nGen.includes(key)||nName.includes(key)) && DD_INTERACTIONS[key].some(x=>mGen.includes(x)||mName.includes(x))) {
        drugDrug={existing:m.drug.name,severity:'Moderate'};break;
      }
      if ((mGen.includes(key)||mName.includes(key)) && DD_INTERACTIONS[key].some(x=>nGen.includes(x)||nName.includes(x))) {
        drugDrug={existing:m.drug.name,severity:'Moderate'};break;
      }
    }
    if(drugDrug)break;
  }
  if(allergyMatch){
    showModal(`<div class="modal-header" style="background:var(--err)"><span>⚠️ Drug/Allergy Interaction Warning</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="dur-crit dur" style="margin-bottom:16px">
        <div class="dur-t">⚠️ ALLERGY CONFLICT DETECTED</div>
        <div class="dur-d"><strong>${esc(selectedDrug.name)}</strong> may interact with patient allergy: <strong>${esc(allergyMatch.substance)}</strong> (${esc(allergyMatch.type)} — ${esc(allergyMatch.reaction)}, ${esc(allergyMatch.severity)})</div>
      </div>
      <p style="font-size:12px;color:var(--txt2)">Do you want to proceed with this order?</p>
      <div class="flex gap-sm jc-e mt-md">

window._queueOrder=function(){

window._previewRx=function(){toast('Prescription preview displayed (simulated)','info')};

window._confirmPrescribe=function(){
  // EPCS 2-factor authentication required for any Schedule II in the queue
  let needsEpcs=S.orderQueue.some(o=>o.drug && o.drug.schedule==='Schedule II');
  if(needsEpcs && !S.prescriberDeaVerified){
    closeModal();
    window._epcsPrompt(()=>window._confirmPrescribe());
    return;
  }
  let pid=S.selectedPatient;
  if(!S.patientMeds[pid])S.patientMeds[pid]=[];
  let pharmIds=S.patientPreferredPharm[pid]||[];
  let pt=S.patients.find(p=>p.id===pid);
  S.orderQueue.forEach(o=>{
    let medId='MED-'+Date.now()+'-'+Math.floor(rng()*1000);
    let phId=o.pharmacy||pharmIds[0]||'';
    let ph=pharmById(phId);
    S.patientMeds[pid].push({
      id:medId,
      drug:o.drug,strength:o.strength,dose:o.dose,unit:o.unit,
      directions:o.directions,daysSupply:o.days,qty:o.qty,refills:o.refills,
      rxStart:o.rxStart,rxEnd:o.rxEnd,
      status:'active',prescribed:true,
      sendToPharm:phId,
      consent:false,outside:false,
      allergyOverride:!!o.allergyOverride,interactionAck:!!o.interactionAck,
      coverage:o.coverage||''
    });
    // Surescripts activity log + outbox entry
    if(typeof _logRxActivity==='function'){
      _logRxActivity(medId,'Rx Composed','Strength '+o.strength+'; Sig:"'+o.directions+'"; Qty '+o.qty+'; Days '+o.days+'; Refills '+o.refills,'OK');
      if(o.allergyOverride)_logRxActivity(medId,'Allergy Override','Prescriber acknowledged allergy alert','WARN');
      if(o.interactionAck)_logRxActivity(medId,'DDI Acknowledged','Prescriber acknowledged drug-drug interaction','WARN');
      if(o.drug && (o.drug.schedule==='Schedule II'||o.drug.schedule==='Schedule IV'))_logRxActivity(medId,'PMP Queried','State PDMP/CURES query on file','OK');
      if(o.drug && o.drug.schedule==='Schedule II')_logRxActivity(medId,'EPCS 2FA','OATH HOTP verified','OK');
      if(o.sendMethod==='pharmacy')_logRxActivity(medId,'NewRx Transmitted','Surescripts NewRx → '+(ph?ph.name:'(pharmacy)'),'ACK');
      else _logRxActivity(medId,'Script Printed','Paper script printed for patient','OK');
    }
    if(!S.ssOrders)S.ssOrders=[];
    S.ssOrders.push({ts:new Date().toISOString(),type:o.sendMethod==='pharmacy'?'NewRx':'Print',patientId:pid,drug:o.drugName+' '+o.strength,pharmacyName:ph?ph.name:'',status:o.sendMethod==='pharmacy'?'ACK':'OK'});
    // Add to history
    if(!S.medHistory[pid])S.medHistory[pid]=[];
    S.medHistory[pid].push({drug:o.drugName+' '+o.strength,action:'Prescribed',date:today(),reason:'New order'});
    S.prescribedThisSession.push({patientId:pid,drug:o.drugName,strength:o.strength,medId});
  });
  let count=S.orderQueue.length;
  S.orderQueue=[];
  closeModal();
  toast(count+' prescription(s) sent successfully','success');
  S.currentPage='patient-summary';render();
};

window._outsideDrugSearch=function(val){
  let box=document.getElementById('outsideDrugResults');

  let q=val.toLowerCase();
  let matches=DRUG_DB.filter(d=>d.name.toLowerCase().includes(q)||d.generic.toLowerCase().includes(q));
  if(!matches.length){box.innerHTML='<div style="padding:10px;color:var(--txt3);font-size:12px">No drugs found.</div>';box.style.display='block';return}
  box.innerHTML=matches.map((d,i)=>`<div class="search-row" onclick="window._selectOutsideDrug(${DRUG_DB.indexOf(d)})">

};

window._selectOutsideDrug=function(idx){

window._saveConsent=function(){

  let meds=(S.patientMeds[pid]||[]).filter(m=>m.status==='active'&&!m.consent&&!m.outside);

  });
  consentSigs={prescriber:false,client:false};
  closeModal();toast('Consent recorded for '+meds.length+' medication(s)','success');render();
};

function _logRxActivity(medId,event,detail,status){
  if(!S.rxActivity[medId])S.rxActivity[medId]=[];

window._viewActivityLog=function(medId){

window._runPharmSearch=function(){
  let nm=(document.getElementById('phsName')||{}).value||'';
  let st=(document.getElementById('phsState')||{}).value||'';
  let cy=(document.getElementById('phsCity')||{}).value||'';
  let dist=parseFloat((document.getElementById('phsDist')||{}).value||'')||0;
  let epcs=(document.getElementById('phsEpcs')||{}).checked;
  let bh=(document.getElementById('phsBh')||{}).checked;
  let ml=(document.getElementById('phsMail')||{}).checked;
  let net=(document.getElementById('phsNet')||{}).checked;
  let sel=((document.getElementById('phsSelected')||{}).value||'').split(',').filter(Boolean);
  let res=PHARMACIES_DB.filter(p=>{
    if(nm && !p.name.toLowerCase().startsWith(nm.toLowerCase()))return false;
    if(st && p.state!==st)return false;
    if(cy && !((p.city||'').toLowerCase().includes(cy.toLowerCase())||(p.zip||'').includes(cy)))return false;
    if(dist && (p.distance||999)>dist)return false;
    if(epcs && !p.epcs)return false;
    if(bh && !p.behavioralHealth)return false;
    if(ml && !p.mailOrder)return false;
    if(net && !p.networkOnly)return false;
    return true;
  });
  let html=res.length?`<table class="dt"><thead><tr><th style="width:30px"></th><th>Pharmacy</th><th>Address</th><th>NCPDP / NPI</th><th>Distance</th><th>Hours</th><th>Capabilities</th></tr></thead><tbody>${res.map(p=>{
    let checked=sel.includes(p.id)?'checked':'';
    let caps=[];
    caps.push(p.epcs?'<span class="pill epcs">EPCS</span>':'<span class="pill no-epcs">No EPCS</span>');
    if(p.behavioralHealth)caps.push('<span class="pill bh">Behavioral Hlth</span>');
    if(p.mailOrder)caps.push('<span class="pill mail">Mail Order</span>');
    if(p.networkOnly)caps.push('<span class="pill network">In-Network</span>');
    return `<tr><td><input type="checkbox" data-pid="${p.id}" class="phs-pick" ${checked} onchange="window._togglePharmPick(this)"></td><td><strong>${esc(p.name)}</strong></td><td style="font-size:11px">${esc(pharmAddr(p))}</td><td style="font-size:10px;color:var(--txt2)">NCPDP ${esc(p.ncpdp||'')}<br>NPI ${esc(p.npi||'')}</td><td>${p.distance!=null?p.distance+' mi':'—'}</td><td style="font-size:10px;color:var(--txt2)">${esc(p.hours||'—')}</td><td style="font-size:10px">${caps.join(' ')}</td></tr>`
  }).join('')}</tbody></table><div style="font-size:11px;color:var(--txt2);margin-top:6px">${res.length} pharmacy(ies) match your filters.</div>`:'<div style="color:var(--txt3);font-size:12px;padding:14px;text-align:center;border:1px dashed var(--bdr-l);border-radius:4px">No pharmacies match the current filters. Try broadening your search.</div>';
  document.getElementById('phsResults').innerHTML=html;
};
window._togglePharmPick=function(cb){
  let sel=((document.getElementById('phsSelected')||{}).value||'').split(',').filter(Boolean);
  let pid=cb.getAttribute('data-pid');
  if(cb.checked){
    if(sel.length>=3){cb.checked=false;toast('Maximum 3 preferred pharmacies','warn');return}
    if(!sel.includes(pid))sel.push(pid);
  } else {
    sel=sel.filter(x=>x!==pid);
  }
  document.getElementById('phsSelected').value=sel.join(',');
  let lbl=document.getElementById('phsSelLabel');
  if(lbl)lbl.innerHTML=sel.length?sel.map(id=>{let p=pharmById(id);return p?esc(p.name):id}).join(' · '):'(none)';
};
window._savePharmSearch=function(){
  let pid=S.selectedPatient;
  let sel=((document.getElementById('phsSelected')||{}).value||'').split(',').filter(Boolean);
  S.patientPreferredPharm[pid]=sel;
  closeModal();toast('Preferred pharmacies updated ('+sel.length+')','success');render();
};

          <div><label>DEA</label><div>BC1234567 ${S.prescriberDeaVerified?'<span class="alert-badge ok">Verified</span>':'<span class="alert-badge warn">Unverified</span>'}</div></div>
          <div><label>Surescripts SPI</label><div>${esc(S.spiNumber||'1234567890001234567890')}</div></div>
          <div><label>Service Level</label><div>${esc(S.serviceLevel||'Level 6 — Full eRx + Renewals + CancelRx + EPCS')}</div></div>
          <div><label>EPCS Token</label><div>OATH HOTP — Last sync: ${esc(today())}</div></div>
        </div>
      </div></div>
      <div class="card"><div class="card-h">⚙️ Display Preferences</div><div class="card-b">
        <p style="font-size:12px;color:var(--txt2)">Reporting level, default pharmacy, and notification settings can be managed under Mailbox → Reporting.</p>
      </div></div>
    </div>
    <div class="status-bar"><span>Tools Module</span><span id="clock">${clockStr()}</span></div>
  </div>`;
}
window._addSurrogate=function(){
  showModal(`<div class="modal-header"><span>+ Add Surrogate</span><button class="close-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="fg"><label>Surrogate Full Name</label><input class="fc" id="srgName"></div>
    <div class="fg"><label>NPI</label><input class="fc" id="srgNpi"></div>
    <div class="fg"><label>Role</label><select class="fc" id="srgRole"><option>Reviewer</option><option>Co-Prescriber</option><option>Coverage Provider</option></select></div>
    <div class="flex gap-sm jc-e mt-md"><button class="btn btn-out" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="window._saveSurrogate()">Save</button></div>
  </div>`);
};
window._saveSurrogate=function(){
  let nm=document.getElementById('srgName').value.trim();
  let np=document.getElementById('srgNpi').value.trim();
  if(!nm||!np){toast('Name and NPI required','error');return}
  if(!S.surrogates)S.surrogates=[];
  S.surrogates.push({name:nm,npi:np,role:document.getElementById('srgRole').value,active:true});
  closeModal();toast('Surrogate added','success');render();
};

/* ═══════════════════════════════════════════════════
   HEADER HELPER
   ═══════════════════════════════════════════════════ */
function _ssPendingTotal(){return (S.renewalRequests||[]).filter(r=>r.status==='pending').length}
function _navTab(key,label,icon,extra){
  let map={'patient-summary':'patient-summary','rx':'patient-summary','search':'search','mailbox':'mailbox','vitals':'vitals','hp':'hp','reports':'reports','tools':'tools'};
  let target=map[key]||key;
  let active=S.currentPage===target||(key==='rx'&&S.currentPage==='new-order')||(key==='rx'&&S.currentPage==='add-outside-med');
  return `<div class="ehr-tab ${active?'active':''}" onclick="window._ehrNav('${key}')"><span>${icon}</span>${label}${extra||''}</div>`;
}
window._ehrNav=function(k){
  if(k==='search'){S.currentPage='search';S.selectedPatient=null;render();return}
  if(k==='patient-summary'||k==='rx'){
    if(!S.selectedPatient){toast('Select a patient first','warn');S.currentPage='search';render();return}
    S.currentPage='patient-summary';S.currentNav='summary';render();return
  }
  S.currentPage=k;render();
};

function headerHTML(title){
  let pend=_ssPendingTotal();
  let pat=S.patients.find(p=>p.id===S.selectedPatient);
  let patChip=pat?`<span class="badge" style="background:#fff;color:#1a3a5c">${esc(pat.name)} (${esc(pat.mrn||pat.id)})</span>`:'';
  let pmpAlert=(pat && (S.patientMeds[pat.id]||[]).some(m=>m.status==='active' && m.drug && (m.drug.schedule==='Schedule II'||m.drug.schedule==='Schedule IV')))?'<span class="pill-pmp">CS</span>':'';
  let tabs=[
    _navTab('search','Patient Search','🔍'),
    _navTab('patient-summary','Patient Summary','📋'),
    _navTab('rx','Rx (Medications)','💊',pmpAlert),
    _navTab('hp','History &amp; Physical','📝'),
    _navTab('vitals','Vitals &amp; Labs','🩺'),
    _navTab('mailbox','Surescripts Mailbox','📨',pend?`<span class="badge-tab">${pend}</span>`:''),
    _navTab('reports','Reports','📊'),
    _navTab('tools','Tools','⚙️')
  ].join('');
  return `<div class="ehr-top">
    <div class="ehr-top-row1">
      <div class="ehr-brand"><span class="ic">💊</span> SmartCare EHR <span style="opacity:.6;font-weight:400">/ Rx Module</span> <span style="opacity:.6;font-size:11px;font-weight:400">— ${esc(title)}</span></div>
      <div class="ehr-prescriber">
        ${patChip}
        <span>Prescriber: <strong>Dr. Chen, Wei-Lin</strong> <span class="badge">NPI 1234567890</span> <span class="badge">DEA BC1234567</span></span>
        <button class="ss-mailbox-btn ${pend?'has-pending':''}" onclick="window._ehrNav('mailbox')" title="Surescripts Mailbox">✉️ Mailbox ${pend?`<span class="ct">${pend}</span>`:''}</button>
        <span class="clk" id="clock">${clockStr()}</span>
        <button class="btn btn-out btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)" onclick="S.loggedIn=false;S.currentPage='login';S.selectedPatient=null;render()">Logout</button>
      </div>
    </div>
    <div class="ehr-tabs">${tabs}</div>
  </div>`;
}

/* ─── Boot ─── */
window._medgym_init(42);

})();
</script>
