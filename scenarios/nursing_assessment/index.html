<!DOCTYPE html>
<!--
  MedGym Scenario: Nursing Assessment Station — Cerner PowerChart iView-style

  UI inspired by Cerner Millennium PowerChart iView nursing flowsheet
  (reference: 8.nursing_assessment.pdf — "iView Training Manual, Jan 2019").
  Key elements modelled:
    - Three-pane layout: Navigator bands (left) | Time-scale flowsheet grid (centre) | Result Viewer (right)
    - Toolbar icons: As Of refresh, Sign (green check), Cancel (red X),
      Insert Date/Time, Show/Hide Empty Rows, Collapse Navigator, Add Dynamic Group
    - Time-column documentation: double-click blue cells, then Sign to commit
    - Calculation icon for auto-totalled scores (Braden, Morse, GCS, MUST)
    - Dynamic Groups for repeating items (IV Sites, Wounds, Lines/Tubes/Drains)
    - Right-click context: Add Comment / Modify / Unchart / Change Date

  REAL-WORLD CLINICAL REFERENCES:
  1. Braden Scale: Bergstrom N, Braden BJ, et al. Nursing Research. 1987;36(4):205-210.
  2. Morse Fall Scale: Morse JM, et al. Canadian J Aging. 1989;8(4):366-377.
  3. Glasgow Coma Scale: Teasdale G, Jennett B. The Lancet. 1974;304(7872):81-84.
  4. NRS Pain Scale: McCaffery M, Beebe A. Pain: Clinical Manual. Mosby, 1989.
  5. MUST Screening Tool: BAPEN Malnutrition Advisory Group, 2003.
  6. Joint Commission Pain Management Standards (PC.01.02.07).
  7. Cerner Corporation. PowerChart iView Training Manual, Jan 2019.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursing Assessment Station — Clinical Assessment Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8eef4;--bg4:#d0dde8;
  --green:#0d47a1;--green2:#1565c0;--green-dark:#0a2f6b;--green-light:#90caf9;
  --success:#2e7d32;--warn:#ef6c00;--danger:#c62828;--info:#0277bd;
  --text:#1a2332;--text2:#455a64;--text3:#78909c;
  --border:#b0bec5;--border2:#e0e4e8;
  --radius:4px;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
}
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;background:#fff;color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:80px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border2)}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:var(--bg3)}
.app{display:flex;flex-direction:column;height:100vh}
.header{background:#1a2332;border-bottom:2px solid #1565c0;padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px;letter-spacing:0.2px}
.header h1 .icon{font-size:18px;color:#64b5f6}
.header-right{display:flex;align-items:center;gap:16px}
.header-right .user-info{color:rgba(255,255,255,.85);font-size:13px}
.header-right .user-info strong{color:#fff}
.nav{display:flex;gap:4px}
.nav button{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);padding:8px 16px;border-radius:var(--radius);font-size:13px;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.25);color:#fff}
.nav button.active{background:rgba(255,255,255,.95);color:#0d47a1;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:none;border-radius:var(--radius);font-weight:600;font-size:13px;transition:.15s}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-warn{background:var(--warn);color:#000}.btn-warn:hover{opacity:.9}
.btn-info{background:var(--info);color:#fff}.btn-info:hover{opacity:.9}
.btn-outline{background:none;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--green);color:var(--green)}
.btn-sm{padding:5px 12px;font-size:12px}
.main{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge-danger{background:rgba(211,47,47,.15);color:var(--danger)}
.badge-success{background:rgba(56,142,60,.15);color:var(--success)}
.badge-warn{background:rgba(249,168,37,.15);color:#e65100}
.badge-info{background:rgba(25,118,210,.15);color:var(--info)}
.badge-neutral{background:rgba(148,163,184,.15);color:var(--text3)}
/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;background:#1a2332}
.login-box{background:#fff;border:1px solid var(--border2);border-radius:12px;padding:48px 40px;width:420px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.login-box h2{text-align:center;font-size:20px;margin-bottom:8px;color:#1a2332;font-weight:700;letter-spacing:-0.3px}
.login-box .subtitle{text-align:center;color:var(--text3);margin-bottom:32px;font-size:13px}
.login-box .logo{text-align:center;font-size:48px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.login-box .btn{width:100%;justify-content:center;padding:12px;font-size:15px}
.error-msg{color:var(--danger);font-size:13px;margin-top:8px;display:none}
/* Patient card */
.patient-card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:space-between}
.patient-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12);border-color:var(--green)}
.patient-card .left{display:flex;align-items:center;gap:14px}
.patient-card .bed-badge{background:var(--green);color:#fff;padding:6px 12px;border-radius:8px;font-weight:700;font-size:16px;min-width:56px;text-align:center}
.patient-card .patient-info h3{font-size:15px;margin-bottom:2px}
.patient-card .patient-info .meta{font-size:12px;color:var(--text3)}
.patient-card .right{display:flex;align-items:center;gap:12px}
.patient-card .alerts{display:flex;gap:6px}
.alert-icon{font-size:18px;cursor:help}
.patient-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Sub-nav tabs */
.sub-nav{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border2);padding-bottom:0}
.sub-nav button{background:none;border:none;color:var(--text3);padding:10px 16px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.sub-nav button:hover{color:var(--green)}
.sub-nav button.active{color:var(--green-dark);border-bottom-color:var(--green)}
/* Stats bar */
.stats-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-item{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:14px 20px;min-width:130px;box-shadow:var(--shadow)}
.stat-item .stat-val{font-size:24px;font-weight:700;color:var(--green-dark)}
.stat-item .stat-label{font-size:12px;color:var(--text3);margin-top:2px}
/* Score gauge */
.score-gauge{display:flex;align-items:center;gap:12px;margin:12px 0}
.score-bar{flex:1;height:24px;background:#e2e8f0;border-radius:12px;overflow:hidden;position:relative}
.score-fill{height:100%;border-radius:12px;transition:.5s}
.score-value{font-size:24px;font-weight:700;min-width:60px;text-align:center}
/* Scale item */
.scale-item{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:16px;margin-bottom:12px}
.scale-item h4{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--green-dark)}
.scale-item .options{display:flex;flex-direction:column;gap:6px}
.scale-item .option-row{display:flex;align-items:center;gap:8px}
.scale-item .option-row input[type="radio"]{width:auto;margin:0}
.scale-item .option-row label{font-size:13px;cursor:pointer}
/* Body diagram */
.body-diagram{position:relative;width:200px;height:400px;margin:0 auto}
.body-diagram svg{width:100%;height:100%}
.body-region{cursor:pointer;fill:rgba(46,125,50,.1);stroke:var(--green);stroke-width:1;transition:.2s}
.body-region:hover,.body-region.active{fill:rgba(211,47,47,.3);stroke:var(--danger)}
/* Pain slider */
.pain-slider{width:100%;margin:16px 0}
.pain-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.pain-value{font-size:36px;font-weight:700;text-align:center;margin:8px 0}
/* Summary matrix */
.matrix-table th,.matrix-table td{text-align:center;padding:8px}
.matrix-table td.overdue{background:rgba(211,47,47,.1);color:var(--danger);font-weight:700}
/* GCS component */
.gcs-component{margin-bottom:16px;padding:16px;background:var(--bg3);border-radius:8px}
.gcs-component h4{margin-bottom:10px;color:var(--green-dark);font-size:14px}
/* Toast */
.toast-container{position:fixed;top:68px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:slideIn .3s ease}
.toast-success{background:var(--success);color:#fff}
.toast-danger{background:var(--danger);color:#fff}
.toast-info{background:var(--info);color:#fff}
.toast-warn{background:var(--warn);color:#000}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:#fff;border:1px solid var(--border2);border-radius:12px;padding:28px;width:750px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.modal h3{font-size:18px;margin-bottom:20px;display:flex;align-items:center;gap:8px;color:var(--green-dark)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
/* Responsive */
@media(max-width:900px){.patient-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
/* Print */
@media print{.header,.nav,.btn,.toast-container,.modal-overlay,.sub-nav{display:none!important}.main{padding:0}.card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}}
/* Scrollbar */
.main::-webkit-scrollbar{width:8px}
.main::-webkit-scrollbar-track{background:var(--bg)}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.main::-webkit-scrollbar-thumb:hover{background:var(--green)}
/* Animations */
.patient-card,.scale-item,.gcs-component{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Clinical polish overrides */
th{background:#e8eef4;color:#37474f;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid #b0bec5}
.card{border:1px solid #d0dde8;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:600;color:#1a2332;gap:6px;border-bottom:1px solid #e0e4e8;padding-bottom:12px;margin-bottom:14px}
.card-title i{color:#0d47a1;font-size:15px}
.badge{font-size:10px;font-weight:600;border-radius:3px;padding:2px 6px;letter-spacing:.3px}
.stat-item{border-radius:6px;border:1px solid #d0dde8}
.stat-item .stat-val{font-size:22px;color:#0a2f6b}
.patient-card{border:1px solid #d0dde8;border-radius:6px;transition:.15s}
.patient-card:hover{border-color:#1565c0;box-shadow:0 2px 8px rgba(13,71,161,.12)}
.patient-card .bed-badge{background:#0d47a1;border-radius:4px;font-size:14px;padding:5px 10px}
.login-box{border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1)}
input:focus,select:focus,textarea:focus{border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.15)}
.toast{border-radius:4px;font-weight:500}
.scale-item{border:1px solid #d0dde8;border-radius:6px}
.scale-item h4{color:#0a2f6b}
.gcs-component{background:#e8eef4;border-radius:6px}
.gcs-component h4{color:#0a2f6b}
.score-fill{border-radius:4px}
.intervention-plan{border:2px solid #ef6c00}
/* Intervention plan */
.intervention-plan{border:2px solid var(--warn);border-radius:8px;padding:16px;margin-top:12px;background:rgba(249,168,37,.06)}
.intervention-plan h4{color:#e65100;margin-bottom:8px}

/* ===== Cerner iView styling ===== */
.iview-toolbar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:linear-gradient(to bottom,#e8eef4,#d0dde8);border-bottom:1px solid #b0bec5;margin-bottom:8px;border-radius:4px}
.iview-tool-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;background:transparent;border:1px solid transparent;border-radius:3px;color:#37474f;font-size:14px;transition:.1s}
.iview-tool-btn:hover{background:#fff;border-color:#90a4ae;box-shadow:inset 0 0 0 1px #cfd8dc}
.iview-tool-btn.sign{color:#2e7d32;font-size:16px}
.iview-tool-btn.cancel{color:#c62828;font-size:16px}
.iview-tool-divider{width:1px;height:18px;background:#90a4ae;margin:0 4px}
.iview-tool-label{font-size:11px;color:#546e7a;margin-left:8px;font-style:italic}

.iview-pane{display:grid;grid-template-columns:220px 1fr;gap:0;border:1px solid #b0bec5;border-radius:4px;background:#fff;height:calc(100vh - 220px);min-height:520px;overflow:hidden}
.iview-nav{background:#eceff1;border-right:1px solid #b0bec5;overflow-y:auto;font-size:12px}
.iview-nav-section{padding:6px 10px;background:#cfd8dc;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#37474f;border-bottom:1px solid #b0bec5}
.iview-band{padding:6px 10px 6px 18px;cursor:pointer;border-bottom:1px solid #e0e4e8;color:#263238;display:flex;align-items:center;gap:6px;transition:.1s}
.iview-band:hover{background:#fff}
.iview-band.active{background:#1565c0;color:#fff;font-weight:600}
.iview-band .band-icon{font-size:11px;color:#78909c;width:14px;text-align:center}
.iview-band.active .band-icon{color:#fff}
.iview-band .band-badge{margin-left:auto;font-size:10px;padding:1px 5px;border-radius:8px;background:#fff;color:#0d47a1;font-weight:700}
.iview-band.active .band-badge{background:#0d47a1;color:#fff}

.iview-grid{overflow:auto;background:#fff}
.iview-grid table{border-collapse:separate;border-spacing:0;width:auto;min-width:100%;font-size:12px}
.iview-grid th,.iview-grid td{padding:4px 8px;border:1px solid #cfd8dc;text-align:center;white-space:nowrap;vertical-align:middle;height:26px}
.iview-grid thead th{background:linear-gradient(to bottom,#eceff1,#cfd8dc);position:sticky;top:0;z-index:3;font-size:11px;font-weight:600;color:#263238;text-transform:none;letter-spacing:0;min-width:90px}
.iview-grid thead th.row-label-col{position:sticky;left:0;z-index:4;background:linear-gradient(to right,#eceff1,#cfd8dc);text-align:left;min-width:240px;padding-left:12px}
.iview-grid thead th.col-active{background:linear-gradient(to bottom,#fff9c4,#ffe082);color:#e65100}
.iview-grid tbody td.row-label{position:sticky;left:0;background:#f5f7fa;text-align:left;font-weight:500;color:#263238;min-width:240px;padding-left:12px;border-right:2px solid #b0bec5;z-index:2}
.iview-grid tbody td.row-label .calc-icon{color:#2e7d32;margin-right:4px}
.iview-grid tbody td.row-label .row-units{color:#78909c;font-size:11px;margin-left:6px;font-weight:400}
.iview-grid tbody tr.section-header td{background:#37474f;color:#fff;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;position:sticky;left:0;z-index:1}
.iview-grid tbody tr.subsection-header td{background:#cfd8dc;color:#37474f;text-align:left;font-weight:600;font-size:11px;padding:3px 12px}
.iview-grid td.cell-active{background:#fff9c4;cursor:cell}
.iview-grid td.cell-empty{background:#e3f2fd;cursor:cell}
.iview-grid td.cell-empty:hover{background:#bbdefb}
.iview-grid td.cell-signed{background:#fff;color:#1a2332;font-weight:500}
.iview-grid td.cell-unsigned{background:#fff3cd;color:#e65100;font-weight:600;font-style:italic}
.iview-grid td.cell-unsigned::after{content:' *';color:#c62828}
.iview-grid td.cell-abnormal{color:#c62828;font-weight:700}
.iview-grid td.cell-critical{background:#ffebee;color:#c62828;font-weight:700}
.iview-grid td.cell-comment::before{content:'\f075';font-family:'Font Awesome 6 Free';font-weight:900;font-size:9px;color:#0277bd;margin-right:3px;vertical-align:super}
.iview-grid input.cell-input{width:100%;border:1px solid #1565c0;padding:2px 4px;font-size:12px;text-align:center;background:#fff9c4;border-radius:0;height:22px}
.iview-grid select.cell-input{width:100%;border:1px solid #1565c0;padding:1px 2px;font-size:12px;background:#fff9c4;height:22px;border-radius:0}

.dynamic-group-bar{background:#e8eaf6;border:1px dashed #5c6bc0;border-radius:4px;padding:6px 10px;margin:6px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:#283593}
.dynamic-group-bar .add-btn{background:#3949ab;color:#fff;border:none;border-radius:3px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:600}

.context-menu{position:fixed;background:#fff;border:1px solid #b0bec5;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:3000;min-width:180px;padding:4px 0;font-size:12px}
.context-menu div{padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#263238}
.context-menu div:hover{background:#1565c0;color:#fff}
.context-menu div.divider{padding:0;border-top:1px solid #e0e4e8;margin:2px 0;cursor:default}
.context-menu div.divider:hover{background:transparent}
.context-menu i{width:14px;color:#546e7a}
.context-menu div:hover i{color:#fff}

.flowsheet-legend{display:flex;gap:14px;font-size:11px;color:#546e7a;padding:6px 12px;background:#f5f7fa;border:1px solid #e0e4e8;border-radius:4px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.flowsheet-legend .swatch{display:inline-block;width:14px;height:14px;border:1px solid #b0bec5;vertical-align:middle;margin-right:4px;border-radius:2px}

.must-step{border:1px solid #d0dde8;border-radius:6px;padding:14px;margin-bottom:10px;background:#fff}
.must-step h4{color:#0a2f6b;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.must-step h4 .step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#0d47a1;color:#fff;font-size:12px}
.must-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.must-options label{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border:1px solid #d0dde8;border-radius:4px;cursor:pointer;font-size:12px;background:#fafbfc;transition:.1s}
.must-options label:hover{border-color:#1565c0;background:#e3f2fd}
.must-options input[type="radio"]{margin-top:2px}
.must-options input[type="radio"]:checked + span{font-weight:600;color:#0d47a1}

.dyngroup-card{border:1px solid #b39ddb;border-radius:6px;padding:12px;margin-bottom:10px;background:linear-gradient(to bottom right,#f3e5f5,#fff)}
.dyngroup-card .dg-label{font-weight:700;color:#4527a0;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed #b39ddb}
.dyngroup-card .dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.dyngroup-card .dg-grid .dg-field label{display:block;font-size:11px;color:#5e35b1;font-weight:600;margin-bottom:3px}
.dyngroup-card .dg-grid .dg-field input,.dyngroup-card .dg-grid .dg-field select{font-size:12px;padding:5px 8px;width:100%}

/* ─── Risk level helpers ─── */
function bradenRisk(total){
 if(total<=9) return {level:'Very High Risk',levelZh:'',cls:'badge-danger',color:'var(--danger)'};
 if(total<=12) return {level:'High Risk',levelZh:'',cls:'badge-danger',color:'var(--danger)'};
 if(total<=14) return {level:'Moderate Risk',levelZh:'',cls:'badge-warn',color:'#e65100'};
 if(total<=18) return {level:'Mild Risk',levelZh:'',cls:'badge-info',color:'var(--info)'};
 return {level:'No Risk',levelZh:'',cls:'badge-success',color:'var(--success)'};
}
function morseRisk(total){
 if(total>=45) return {level:'High Risk',levelZh:'',cls:'badge-danger',color:'var(--danger)'};
 if(total>=25) return {level:'Moderate Risk',levelZh:'',cls:'badge-warn',color:'#e65100'};
 return {level:'Low Risk',levelZh:'',cls:'badge-success',color:'var(--success)'};
}
function painLevel(score){
 if(score>=7) return {level:'Severe',levelZh:'',cls:'badge-danger',color:'var(--danger)'};
 if(score>=4) return {level:'Moderate',levelZh:'',cls:'badge-warn',color:'#e65100'};
 if(score>=1) return {level:'Mild',levelZh:'',cls:'badge-info',color:'var(--info)'};
 return {level:'No Pain',levelZh:'',cls:'badge-success',color:'var(--success)'};
}
function gcsLevel(total){
 if(total<=8) return {level:'Severe',levelZh:'',cls:'badge-danger',color:'var(--danger)'};
 if(total<=12) return {level:'Moderate',levelZh:'',cls:'badge-warn',color:'#e65100'};
 return {level:'Mild',levelZh:'',cls:'badge-success',color:'var(--success)'};
}
function bradenTotal(scores){
  if(!scores) return null;
  const keys=['sensory','moisture','activity','mobility','nutrition','friction'];
  const vals=keys.map(k=>scores[k]);
  if(vals.some(v=>v==null||v===undefined)) return null;
  return vals.reduce((s,v)=>s+v,0);
}
function morseTotal(scores){
  if(!scores) return null;
  const keys=['history','secondary_dx','ambulatory_aid','iv_heparin','gait','mental_status'];
  const vals=keys.map(k=>scores[k]);
  if(vals.some(v=>v==null||v===undefined)) return null;
  return vals.reduce((s,v)=>s+v,0);
}
function gcsTotal(scores){
  if(!scores) return null;
  const keys=['eye','verbal','motor'];
  const vals=keys.map(k=>scores[k]);
  if(vals.some(v=>v==null||v===undefined)) return null;
  return vals.reduce((s,v)=>s+v,0);
}

/* ─── Init ─── */
window._medgym_init=function(seed){
  rng=mulberry32(seed||42);
  patientIdCounter=300;
  S.loggedIn=false;S.currentPage='login';S.selectedPatient=null;
  S.patients=[];S.bradenScores={};S.morseScores={};S.painAssessments={};S.gcsScores={};
  S.assessmentHistory=[];S.interventionsPlanned={};S.overdueAssessments=[];
  S.iviewColumns={};S.iviewActiveCol={};S.iviewActiveBand={};S.iviewData={};
  S.showEmptyRows={};S.navCollapsed={};
  S.vitalSigns={};S.ivSites={};S.wounds={};S.linesTubes={};
  S.nutritionScreens={};S.painScores={};S.interventionPlans={};

  const namePool=shuffle(PATIENT_NAMES);
  let nIdx=0;
  const diagPool=shuffle(DIAGNOSES);
  let dIdx=0;

  const now=new Date();

  /* Build 8 patients */
  for(let bed=1;bed<=8;bed++){
    const pid=nextPid();
    const name=namePool[nIdx++%namePool.length];
    const age=randInt(45,88);
    const daysAdmitted=randInt(2,10);
    const admitDate=new Date(now.getTime()-daysAdmitted*86400000).toISOString().slice(0,10);

    let diag;
    /* Specific patients for safety traps */
 if(bed===2) diag='Right hip fracture s/p ORIF (POD 2, restricted weight-bearing)'; // Braden high risk
 else if(bed===4) diag='Mechanical fall with L4 compression fracture, history of previous falls'; // Post-fall
 else if(bed===6) diag='Traumatic brain injury — subdural hematoma (non-operative, GCS 10)'; // GCS ~10
 else if(bed===7) diag='Metastatic pancreatic cancer — chronic pain syndrome (opioid-dependent)'; // Pain 8/10
    else diag=diagPool[dIdx++%diagPool.length];

    /* Assessment scheduling */
    let bradenDue, morseDue, painDue, gcsDue;
    const dueBase=new Date(now.getTime()-randInt(0,48)*3600000);
    bradenDue=bed<=4?dateTimeStr(new Date(dueBase.getTime()-randInt(0,24)*3600000)):dateTimeStr(new Date(now.getTime()+randInt(2,24)*3600000));
    morseDue=bed<=5?dateTimeStr(new Date(dueBase.getTime()-randInt(0,12)*3600000)):dateTimeStr(new Date(now.getTime()+randInt(2,24)*3600000));
    painDue=(bed===7||bed<=3)?dateTimeStr(new Date(dueBase.getTime()-randInt(0,6)*3600000)):dateTimeStr(new Date(now.getTime()+randInt(4,48)*3600000));
    gcsDue=(bed===6)?dateTimeStr(new Date(dueBase.getTime()-randInt(0,4)*3600000)):dateTimeStr(new Date(now.getTime()+randInt(6,72)*3600000));

    S.patients.push({
      id:pid,bed,name,diagnosis:diag,age,
      gender:pick(['M','F']),
      admitDate,room:'NAU-'+String(200+bed),
 physician:'Dr.'+pick(['Li','Wang','Zhang','Chen','Zhao']),
      allergies:pick(['NKDA','Penicillin','Sulfa','Aspirin','Codeine','NKDA','NKDA']),
      bradenDue,morseDue,painDue,gcsDue,
      fallHistory:bed===4
    });

    S.bradenScores[String(pid)]=null;
    S.morseScores[String(pid)]=null;
    S.painAssessments[String(pid)]=null;
    S.gcsScores[String(pid)]=null;
    S.interventionsPlanned[String(pid)]=[];

    /* iView seed: 4 historical timestamps q4h, all signed; one fresh active column */
    const cols=[];
    for(let h=16;h>=4;h-=4){
      cols.push({ts:dateTimeStr(new Date(now.getTime()-h*3600000)),signed:true});
    }
    cols.push({ts:dateTimeStr(now),signed:false});
    S.iviewColumns[String(pid)]=cols;
    S.iviewActiveCol[String(pid)]=cols.length-1;
    S.iviewActiveBand[String(pid)]='vitals';
    S.iviewData[String(pid)]={};
    S.showEmptyRows[String(pid)]=true;
    S.navCollapsed[String(pid)]=false;

    /* Vital signs trend (slightly randomised plausible values) */
    const baseHR=randInt(70,95);const baseSBP=randInt(110,135);
    S.vitalSigns[String(pid)]=cols.map((c,i)=>({
      ts:c.ts,
      temp:randFloat(36.4,37.6),
      hr:baseHR+randInt(-8,8),
      rr:randInt(14,22),
      sbp:baseSBP+randInt(-10,10),
      dbp:randInt(60,85),
      spo2:randInt(94,99)
    }));
    /* Push vital sign values into iview signed cells for the historical columns */
    const vsRows=['temp','hr','rr','sbp','dbp','spo2'];
    cols.forEach((c,ci)=>{
      if(!c.signed) return;
      vsRows.forEach(r=>{
        const k='vitals.'+r;
        if(!S.iviewData[String(pid)][k]) S.iviewData[String(pid)][k]={};
        S.iviewData[String(pid)][k][ci]={value:String(S.vitalSigns[String(pid)][ci][r]),signed:true,by:pick(['Zhang RN','Li RN','Wang RN','Chen RN']),at:c.ts};
      });
    });

    /* IV Sites — dynamic group */
    const nIV=randInt(1,2);
    S.ivSites[String(pid)]=[];
    for(let i=0;i<nIV;i++){
      S.ivSites[String(pid)].push({
        label:pick(['Left forearm IV','Right forearm IV','Left antecubital IV','Right antecubital IV','Left dorsal hand IV'])+(i>0?' #'+(i+1):''),
        site:pick(['L forearm','R forearm','L hand','R hand','L AC','R AC']),
        gauge:pick(IV_GAUGES),type:pick(IV_TYPES),
        inserted:dateStr(new Date(now.getTime()-randInt(0,3)*86400000)),
        condition:pick(['Patent, no redness','Patent, slight redness','Patent']),
        active:true
      });
    }
    /* Wounds */
    S.wounds[String(pid)]=[];
    if(bed===2||bed===4||rng()<0.25){
      S.wounds[String(pid)].push({
        label:bed===2?'R hip surgical incision':(bed===4?'L4 region abrasion':'Sacral pressure area'),
        location:bed===2?'Right hip':(bed===4?'Lumbar back':'Sacrum'),
        type:bed===2?'Surgical incision':(bed===4?'Skin tear':'Pressure injury Stage I'),
        sizeCm:bed===2?'12 x 0.5 x 0':(bed===4?'4 x 3 x 0.1':'2 x 2 x 0'),
        drainage:bed===2?'Serosanguinous':'Serous',
        treatment:bed===2?'Dry sterile dressing q24h':'Hydrocolloid dressing',
        active:true
      });
    }
    /* Lines / Tubes / Drains */
    S.linesTubes[String(pid)]=[];
    if(bed===6) S.linesTubes[String(pid)].push({type:'Foley catheter',location:'Bladder',inserted:dateStr(new Date(now.getTime()-2*86400000)),output:'Yellow clear, ~50 mL/hr',status:'In place'});
    if(bed===6) S.linesTubes[String(pid)].push({type:'NG tube',location:'L nare',inserted:dateStr(new Date(now.getTime()-3*86400000)),output:'Clamped, no drainage',status:'In place to LIS'});
    if(bed===2) S.linesTubes[String(pid)].push({type:'JP drain',location:'R hip incision',inserted:admitDate,output:'15 mL serosanguinous',status:'In place'});
  }

  /* ─── Pre-populate assessments for 4 patients ─── */

  /* Patient Bed 2: Braden score 10 (high risk) — needs intervention plan */
  const bed2=S.patients.find(p=>p.bed===2);
  if(bed2){
    const pid2=String(bed2.id);
    S.bradenScores[pid2]={
      sensory:2,moisture:2,activity:1,mobility:2,nutrition:2,friction:1,
 assessedBy:'Zhang Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-26*3600000)),
      savedThisSession:false
    };
    S.assessmentHistory.push({
      type:'braden',patientId:pid2,bed:2,name:bed2.name,
      time:S.bradenScores[pid2].assessedAt,
      total:10,risk:'High Risk'
    });
    /* Morse pre-populated too */
    S.morseScores[pid2]={
      history:0,secondary_dx:15,ambulatory_aid:30,iv_heparin:20,gait:20,mental_status:0,
 assessedBy:'Zhang Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-26*3600000)),
      savedThisSession:false
    };
    S.assessmentHistory.push({
      type:'morse',patientId:pid2,bed:2,name:bed2.name,
      time:S.morseScores[pid2].assessedAt,
      total:85,risk:'High Risk'
    });
  }

  /* Patient Bed 3: Pre-populated with Braden 16 (mild risk) */
  const bed3=S.patients.find(p=>p.bed===3);
  if(bed3){
    const pid3=String(bed3.id);
    S.bradenScores[pid3]={
      sensory:3,moisture:3,activity:3,mobility:3,nutrition:2,friction:2,
 assessedBy:'Li Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-12*3600000)),
      savedThisSession:false
    };
    S.assessmentHistory.push({
      type:'braden',patientId:pid3,bed:3,name:bed3.name,
      time:S.bradenScores[pid3].assessedAt,
      total:16,risk:'Mild Risk'
    });
  }

  /* Patient Bed 4: Post-fall — had Morse 2 days ago, overdue for reassessment */
  const bed4=S.patients.find(p=>p.bed===4);
  if(bed4){
    const pid4=String(bed4.id);
    S.morseScores[pid4]={
      history:25,secondary_dx:15,ambulatory_aid:15,iv_heparin:0,gait:10,mental_status:15,
 assessedBy:'Wang Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-50*3600000)),
      savedThisSession:false
    };
    S.assessmentHistory.push({
      type:'morse',patientId:pid4,bed:4,name:bed4.name,
      time:S.morseScores[pid4].assessedAt,
      total:80,risk:'High Risk'
    });
    S.overdueAssessments.push({
      patientId:pid4,bed:4,name:bed4.name,type:'morse',
      dueAt:bed4.morseDue,reason:'Post-fall reassessment overdue (>24h)'
    });
    S.overdueAssessments.push({
      patientId:pid4,bed:4,name:bed4.name,type:'braden',
      dueAt:bed4.bradenDue,reason:'Post-fall Braden reassessment due'
    });
  }

  /* Patient Bed 6: Decreased consciousness — GCS ~10 */
  const bed6=S.patients.find(p=>p.bed===6);
  if(bed6){
    const pid6=String(bed6.id);
    S.gcsScores[pid6]={
      eye:3,verbal:3,motor:4,
 assessedBy:'Li Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-8*3600000)),
      savedThisSession:false
    };
    S.assessmentHistory.push({
      type:'gcs',patientId:pid6,bed:6,name:bed6.name,
      time:S.gcsScores[pid6].assessedAt,total:10,risk:'Moderate'
    });
    S.overdueAssessments.push({
      patientId:pid6,bed:6,name:bed6.name,type:'gcs',
      dueAt:bed6.gcsDue,reason:'GCS reassessment due — decreased consciousness'
    });
  }

  /* Patient Bed 7: Pain 8/10, needs reassessment */
  const bed7=S.patients.find(p=>p.bed===7);
  if(bed7){
    const pid7=String(bed7.id);
    S.painAssessments[pid7]={
 score:8,location:'Abdomen (Epigastric)',onset:'Progressive over 6 weeks',
      duration:'Continuous',quality:'Aching, burning',
      aggravating:'Movement, sitting',alleviating:'Opioid medication, rest',
      medications:'MS Contin (Morphine SR) 30 mg PO Q12H, Morphine IR 15 mg PO Q4H PRN, Acetaminophen 1000 mg PO Q6H, Ondansetron 4 mg IV PRN for opioid-induced nausea',
 assessedBy:'Wang Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-6*3600000)),
      savedThisSession:false,
      reassessmentDue:dateTimeStr(new Date(now.getTime()-2*3600000))
    };
    S.assessmentHistory.push({
      type:'pain',patientId:pid7,bed:7,name:bed7.name,
      time:S.painAssessments[pid7].assessedAt,total:8,risk:'Severe'
    });
    S.overdueAssessments.push({
      patientId:pid7,bed:7,name:bed7.name,type:'pain',
      dueAt:S.painAssessments[pid7].reassessmentDue,
      reason:'Pain reassessment overdue — score 8/10'
    });
  }

  /* Patient Bed 1: pre-populate pain low */
  const bed1=S.patients.find(p=>p.bed===1);
  if(bed1){
    const pid1=String(bed1.id);
    S.painAssessments[pid1]={
 score:2,location:'Abdomen',onset:'3 days ago',
      duration:'Intermittent',quality:'Dull',
      aggravating:'Eating',alleviating:'Rest',
      medications:'Acetaminophen 500mg PRN',
 assessedBy:'Chen Nurse',
      assessedAt:dateTimeStr(new Date(now.getTime()-18*3600000)),
      savedThisSession:false,
      reassessmentDue:dateTimeStr(new Date(now.getTime()+6*3600000))
    };
  }

  /* Mark some overdue assessments for beds without pre-populated data */
  const bed5=S.patients.find(p=>p.bed===5);
  if(bed5){
    S.overdueAssessments.push({
      patientId:bed5.id,bed:5,name:bed5.name,type:'braden',
      dueAt:bed5.bradenDue,reason:'Initial Braden assessment not completed'
    });
  }

  render();
};

/* ─── Toast ─── */
function toast(msg,type){
  const c=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className='toast toast-'+(type||'info');
  d.textContent=msg;
  c.appendChild(d);
  setTimeout(()=>d.remove(),4000);
}

/* ─── Modal ─── */
function showModal(html){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
window.closeModal=closeModal;

/* ─── Navigation ─── */
function showPage(page){
  S.currentPage=page;
  render();
}
window.showPage=showPage;

function selectPatient(bed){
  const p=S.patients.find(x=>x.bed===bed);
  if(p){S.selectedPatient=p;S.currentPage='iview';render();}
}
window.selectPatient=selectPatient;

function backToList(){
  S.selectedPatient=null;S.currentPage='patientList';render();
}
window.backToList=backToList;

/* ─── RENDER ─── */
function render(){
  const app=document.getElementById('app');
  if(!S.loggedIn){app.innerHTML=renderLogin();return;}
  let html='<div class="app">';
  html+=renderHeader();
  html+='<div class="main">';
  if(S.selectedPatient){
    html+=renderPatientHeader();
    switch(S.currentPage){
      case 'iview': html+=renderIView(); break;
      case 'braden': html+=renderBraden(); break;
      case 'morse': html+=renderMorse(); break;
      case 'pain': html+=renderPain(); break;
      case 'gcs': html+=renderGCS(); break;
      case 'nutrition': html+=renderNutrition(); break;
      case 'dyngroups': html+=renderDynGroups(); break;
      default: html+=renderIView();
    }
  } else {
    switch(S.currentPage){
      case 'dashboard': html+=renderDashboard(); break;
      default: html+=renderPatientList();
    }
  }
  html+='</div></div>';
  app.innerHTML=html;
}

/* ─── Patient Header (sub) ─── */
function renderPatientHeader(){
  const p=S.selectedPatient;
  const pid=String(p.id);
  const bs=S.bradenScores[pid];
  const ms=S.morseScores[pid];
  const pa=S.painAssessments[pid];
  const gs=S.gcsScores[pid];
  let html=`<div class="card" style="display:flex;align-items:center;gap:20px">
    <div class="bed-badge" style="background:var(--green);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:20px">${p.bed}</div>
    <div style="flex:1">
      <h3 style="font-size:16px;margin-bottom:4px">${p.name}</h3>
      <div style="font-size:12px;color:var(--text3)">${p.diagnosis} | Age: ${p.age} | Room: ${p.room} | Allergies: ${p.allergies}</div>
    </div>
    <div style="display:flex;gap:12px">`;
  /* Quick score badges */
  if(bs){
    const t=bradenTotal(bs); const r=bradenRisk(t);
    html+=`<div style="text-align:center"><div style="font-size:11px;color:var(--text3)">Braden</div><span class="badge ${r.cls}">${t} ${r.levelZh}</span></div>`;
  }
  if(ms){
    const t=morseTotal(ms); const r=morseRisk(t);
    html+=`<div style="text-align:center"><div style="font-size:11px;color:var(--text3)">Morse</div><span class="badge ${r.cls}">${t} ${r.levelZh}</span></div>`;
  }
  if(pa){
    const r=painLevel(pa.score);
    html+=`<div style="text-align:center"><div style="font-size:11px;color:var(--text3)">Pain</div><span class="badge ${r.cls}">${pa.score}/10</span></div>`;
  }
  if(gs){
    const t=gcsTotal(gs); const r=gcsLevel(t);
    html+=`<div style="text-align:center"><div style="font-size:11px;color:var(--text3)">GCS</div><span class="badge ${r.cls}">${t}/15</span></div>`;
  }
  html+=`</div></div>`;
  return html;
}

/* ─── Patient List Page ─── */
function renderPatientList(){
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
 <h2 style="font-size:20px">Patient List — Assessment Status</h2>
    <button class="btn btn-info" onclick="showPage('dashboard')">📊 Assessment Dashboard</button>
  </div>`;

  /* Overdue alert */
  if(S.overdueAssessments.length>0){
    html+=`<div class="card" style="border-color:var(--danger);background:rgba(211,47,47,.04)">
      <div class="card-title" style="color:var(--danger)">⚠️ Overdue Assessments (${S.overdueAssessments.length})</div>`;
    S.overdueAssessments.forEach(o=>{
      html+=`<div style="padding:6px 0;font-size:13px"><strong>Bed ${o.bed} — ${o.name}</strong>: ${o.type.toUpperCase()} — ${o.reason}</div>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="patient-grid">`;
  S.patients.forEach(p=>{
    const pid=String(p.id);
    const bs=S.bradenScores[pid];
    const ms=S.morseScores[pid];
    const pa=S.painAssessments[pid];
    const gs=S.gcsScores[pid];
    const overdue=S.overdueAssessments.filter(o=>o.patientId==p.id||o.bed===p.bed);
    const hasHighRisk=(bs&&bradenTotal(bs)<=12)||(ms&&morseTotal(ms)>=45)||(pa&&pa.score>=7)||(gs&&gcsTotal(gs)<=8);

    html+=`<div class="patient-card" onclick="selectPatient(${p.bed})">
      <div class="left">
        <div class="bed-badge">${p.bed}</div>
        <div class="patient-info">
          <h3>${p.name}</h3>
          <div class="meta">${p.diagnosis} | Age ${p.age}</div>
        </div>
      </div>
      <div class="right">
        <div class="alerts">`;
    if(overdue.length>0) html+=`<span class="alert-icon" title="Overdue assessments">🔴</span>`;
    if(hasHighRisk) html+=`<span class="alert-icon" title="High risk">⚠️</span>`;
    if(p.fallHistory) html+=`<span class="alert-icon" title="Fall history">🚨</span>`;
    /* Mini score badges */
    html+=`</div><div style="display:flex;flex-direction:column;gap:2px;font-size:11px">`;
    if(bs){const t=bradenTotal(bs);const r=bradenRisk(t);html+=`<span class="badge ${r.cls}">B:${t}</span>`;}else{html+=`<span class="badge badge-neutral">B:—</span>`;}

window.painColor=function(score){
  score=parseInt(score);
  if(score>=7)return'var(--danger)';

  if(score>=1)return'var(--info)';
  return'var(--success)';
};

 if(!location){toast('Please select pain location','danger');return;}

  keys.forEach(k=>{
    const el=document.querySelector(`input[name="gcs_${k}"]:checked`);
    if(el) scores[k]=parseInt(el.value);
    else complete=false;
  });
 if(!complete){toast('Please complete all 3 GCS components 3 GCS','danger');return;}
  /* Validate ranges */
  if(scores.eye<1||scores.eye>4){toast('Eye opening must be 1-4','danger');return;}
  if(scores.verbal<1||scores.verbal>5){toast('Verbal response must be 1-5','danger');return;}
  if(scores.motor<1||scores.motor>6){toast('Motor response must be 1-6','danger');return;}

  scores.assessedBy='Nurse (Current)';
  scores.assessedAt=dateTimeStr(new Date());
  scores.savedThisSession=true;
  S.gcsScores[pid]=scores;
  const total=gcsTotal(scores);
  const risk=gcsLevel(total);
  S.assessmentHistory.push({
    type:'gcs',patientId:pid,bed:p.bed,name:p.name,
    time:scores.assessedAt,total,risk:risk.level
  });
  S.overdueAssessments=S.overdueAssessments.filter(o=>!(o.bed===p.bed&&o.type==='gcs'));
  toast(`GCS saved: ${total}/15 (E${scores.eye} V${scores.verbal} M${scores.motor}) — ${risk.level}`,'success');
  render();
};

  html+=`<div class="iview-pane" style="${navCollapsed?'grid-template-columns:0 1fr':''}">`;

    html+=`<div class="iview-nav">`;
    IVIEW_BANDS.forEach(grp=>{

        else if(b.id==='wounds'){const n=(S.wounds[pid]||[]).filter(x=>x.active).length;if(n)badge=`<span class="band-badge">${n}</span>`;}
        else if(b.id==='lines'){const n=(S.linesTubes[pid]||[]).length;if(n)badge=`<span class="band-badge">${n}</span>`;}

          });
          html+=`</tr>`;
        });
      });
    } else if(bandObj.id==='wounds'){
      const wnds=(S.wounds[pid]||[]).filter(w=>w.active);
      if(wnds.length===0){
        html+=`<tr><td colspan="${cols.length+1}" style="text-align:center;padding:20px;color:#78909c;font-style:italic">No documented wounds. Use the "Lines / Wounds" tab to add one as a Dynamic Group.</td></tr>`;
      }
      wnds.forEach((w,wi)=>{
        html+=`<tr class="subsection-header"><td colspan="${cols.length+1}"><i class="fa-solid fa-bandage"></i> ${w.label} \u2014 ${w.type} @ ${w.location} <span style="float:right;font-weight:400;color:#546e7a">${w.sizeCm} cm</span></td></tr>`;
        ['Drainage amount','Drainage type','Wound bed','Periwound skin','Dressing changed'].forEach(rowLbl=>{
          html+=`<tr><td class="row-label">&bull; ${rowLbl}</td>`;
          cols.forEach((c,ci)=>{
            html+=renderIViewCell(pid,'wounds_'+wi+'.'+rowLbl,ci,activeCol,c.signed,{type:'sel',opts:rowLbl==='Drainage amount'?['None','Scant','Small','Moderate','Large']:rowLbl==='Drainage type'?DRAINAGE_TYPES:rowLbl==='Wound bed'?['Pink granulation','Red granulation','Yellow slough','Black eschar','Epithelializing']:rowLbl==='Periwound skin'?['Intact','Erythema','Maceration','Excoriation']:['Yes','Refused','N/A']});
          });
          html+=`</tr>`;

    } else if(bandObj.id==='lines'){
      const lt=S.linesTubes[pid]||[];

        html+=`<tr><td colspan="${cols.length+1}" style="text-align:center;padding:20px;color:#78909c;font-style:italic">No lines / tubes / drains documented for this patient.</td></tr>`;

          ['Patency','Output volume','Output appearance','Site assessment'].forEach(rowLbl=>{
            html+=`<tr><td class="row-label">&bull; ${rowLbl}</td>`;
            cols.forEach((c,ci)=>{
              html+=renderIViewCell(pid,'line_'+li+'.'+rowLbl,ci,activeCol,c.signed,{type:rowLbl==='Output volume'?'num':'sel',opts:rowLbl==='Patency'?['Patent','Clogged','Resolved']:rowLbl==='Output appearance'?['Clear','Yellow','Bloody','Bilious','Purulent','Serous']:rowLbl==='Site assessment'?['Intact','Erythema','Drainage at site','Dressing changed']:[]});
            });
            html+=`</tr>`;
          });
        });
      }
    } else {
      const rows=IVIEW_ROWS[bandObj.id]||[];
      rows.forEach(r=>{

        /* Filter empty rows if hide-empty is on */

        html+=`<tr><td class="row-label">${calcIcon}${r.label}${r.unit?'<span class="row-units">'+r.unit+'</span>':''}</td>`;
        cols.forEach((c,ci)=>{

  }

  html+=`</tbody></table></div></div>`;

  /* Quick legacy access banner */
  html+=`<div style="margin-top:10px;padding:8px 12px;background:#fff3e0;border-left:3px solid #ef6c00;border-radius:3px;font-size:12px;color:#5d4037">

    The dedicated <strong>Braden / Morse / Pain / GCS / MUST</strong> assessment tools (with full subscale definitions and risk auto-classification) are available as separate tabs above. Saved scores from those tools also appear in this iView flowsheet.
  </div>`;

  return html;
}

/* Render a single iView cell */
function renderIViewCell(pid,rowKey,colIdx,activeColIdx,colSigned,rowDef){
  const data=S.iviewData[pid]||{};
  const cellData=(data[rowKey]||{})[colIdx];
  const isActive=colIdx===activeColIdx&&!colSigned;

  /* Calculated rows compute live from current column inputs */
  if(rowDef.type==='calc'){
    let val='';let cls='cell-signed';
    if(rowDef.calc==='gcs'){
      const e=parseInt((data['neuro.gcs_e']||{})[colIdx]?.value||'');
      const v=parseInt((data['neuro.gcs_v']||{})[colIdx]?.value||'');
      const m=parseInt((data['neuro.gcs_m']||{})[colIdx]?.value||'');
      if(!isNaN(e)&&!isNaN(v)&&!isNaN(m)){val=(e+v+m);if(e+v+m<=8)cls='cell-critical';}
    } else if(rowDef.calc==='braden'){
      const ks=['braden_sensory','braden_moisture','braden_activity','braden_mobility','braden_nutrition','braden_friction'];
      const vs=ks.map(k=>parseInt((data['skin.'+k]||{})[colIdx]?.value||''));
      if(vs.every(v=>!isNaN(v))){val=vs.reduce((a,b)=>a+b,0);if(val<=12)cls='cell-critical';}
    } else if(rowDef.calc==='morse'){
      const ks=['morse_history','morse_secondary','morse_aid','morse_iv','morse_gait','morse_mental'];
      const vs=ks.map(k=>parseInt((data['falls.'+k]||{})[colIdx]?.value||''));
      if(vs.every(v=>!isNaN(v))){val=vs.reduce((a,b)=>a+b,0);if(val>=45)cls='cell-critical';}
    } else if(rowDef.calc==='must'){
      const ks=['must_bmi','must_wl','must_acute'];
      const vs=ks.map(k=>parseInt((data['nutrition.'+k]||{})[colIdx]?.value||''));
      if(vs.every(v=>!isNaN(v))){val=vs.reduce((a,b)=>a+b,0);if(val>=2)cls='cell-critical';}
    }
    return `<td class="${cls}" style="background:#f1f8e9;font-weight:700;color:#2e7d32">${val!==''?val:'\u2014'}</td>`;
  }

  /* Empty cell in active column \u2192 input field */
  if(!cellData&&isActive){
    if(rowDef.type==='sel'){
      let html=`<td class="cell-active"><select class="cell-input" onchange="iviewSetCell('${rowKey}',${colIdx},this.value)" oncontextmenu="iviewCellMenu(event,'${rowKey}',${colIdx});return false;"><option value="">\u2014</option>`;
      (rowDef.opts||[]).forEach(o=>{html+=`<option value="${o}">${o}</option>`;});
      html+=`</select></td>`;return html;
    }
    return `<td class="cell-active"><input type="${rowDef.type==='num'?'number':'text'}" class="cell-input" placeholder="\u2014" onchange="iviewSetCell('${rowKey}',${colIdx},this.value)" oncontextmenu="iviewCellMenu(event,'${rowKey}',${colIdx});return false;"></td>`;
  }
  /* Empty unsigned, non-active */
  if(!cellData) return `<td class="cell-empty" ondblclick="iviewSetActiveCol(${colIdx})" title="Double-click to make this column active"></td>`;
  /* Has value */
  let cls=cellData.signed?'cell-signed':'cell-unsigned';
  /* Abnormal flagging */
  if(rowDef.type==='num'&&cellData.value!==''){
    const num=parseFloat(cellData.value);
    if(rowDef.abnormalLo!==undefined&&(num<rowDef.abnormalLo||num>rowDef.abnormalHi)) cls+=' cell-abnormal';
  }
  if(cellData.comment) cls+=' cell-comment';
  const tt=`${cellData.value}${cellData.comment?' \u2014 '+cellData.comment:''} \u2014 ${cellData.by||''} @ ${cellData.at||''}`;
  return `<td class="${cls}" oncontextmenu="iviewCellMenu(event,'${rowKey}',${colIdx});return false;" title="${tt.replace(/"/g,'&quot;')}">${cellData.value||''}</td>`;
}

  const pid=String(S.selectedPatient.id);

  S.iviewData[pid][rowKey][colIdx]={value:val,signed:false,by:'Nurse (Current)',at:dateTimeStr(new Date())};
};
window.iviewSignColumn=function(){
  const pid=String(S.selectedPatient.id);
  const col=S.iviewActiveCol[pid];
  const cols=S.iviewColumns[pid];
  if(!cols[col]) return;
  let count=0;
  Object.keys(S.iviewData[pid]||{}).forEach(rk=>{
    const c=S.iviewData[pid][rk][col];
    if(c&&!c.signed){c.signed=true;c.at=dateTimeStr(new Date());count++;}
  });
  cols[col].signed=true;cols[col].ts=dateTimeStr(new Date());

  cols.push({ts:dateTimeStr(new Date()),signed:false});
  S.iviewActiveCol[pid]=cols.length-1;

};

  if(v===null) return;
  cur.ts=v;toast('Column time changed','success');render();
};
window.iviewDeleteColumn=function(colIdx){
  closeContextMenu();
  const pid=String(S.selectedPatient.id);
  if(!confirm('Delete this column and all its entries?')) return;
  S.iviewColumns[pid].splice(colIdx,1);
  Object.keys(S.iviewData[pid]).forEach(rk=>{
    const newMap={};
    Object.keys(S.iviewData[pid][rk]).forEach(ci=>{
      const i=parseInt(ci);if(i<colIdx)newMap[i]=S.iviewData[pid][rk][i];
      else if(i>colIdx)newMap[i-1]=S.iviewData[pid][rk][i];
    });
    S.iviewData[pid][rk]=newMap;
  });
  if(S.iviewActiveCol[pid]>=S.iviewColumns[pid].length) S.iviewActiveCol[pid]=S.iviewColumns[pid].length-1;
  render();
};

/* ─── MUST Nutrition Screening ─── */
function renderNutrition(){
  const p=S.selectedPatient;const pid=String(p.id);
  const ex=S.nutritionScreens[pid];
  let html=`<div class="card"><div class="card-title"><i class="fa-solid fa-bowl-food"></i> Malnutrition Universal Screening Tool (MUST)</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px">Reference: BAPEN Malnutrition Advisory Group (2003). Score Step 1 + Step 2 + Step 3 → Total. 0 = Low, 1 = Medium, ≥2 = High malnutrition risk.</p>`;

  if(ex){
    const totalCls=ex.total>=2?'badge-danger':ex.total===1?'badge-warn':'badge-success';
    html+=`<div style="padding:12px;background:var(--bg3);border-radius:8px;margin-bottom:14px">
      <div style="font-size:13px;color:var(--text3)">Last screened: ${ex.assessedAt} by ${ex.assessedBy}</div>
      <div class="score-gauge"><div class="score-bar"><div class="score-fill" style="width:${Math.min(100,ex.total*33)}%;background:${ex.total>=2?'var(--danger)':ex.total===1?'#e65100':'var(--success)'}"></div></div>
        <div class="score-value">${ex.total}</div></div>
      <div style="text-align:center"><span class="badge ${totalCls}" style="font-size:14px;padding:4px 16px">${ex.risk} Risk</span></div>
      <div style="margin-top:6px;font-size:12px;color:var(--text2)">BMI: ${ex.bmiScore} &nbsp;|&nbsp; Weight Loss: ${ex.weightLossScore} &nbsp;|&nbsp; Acute Disease: ${ex.acuteDiseaseScore}</div>
    </div>`;
  }

  /* Step 1 */
  html+=`<div class="must-step"><h4><span class="step-num">1</span>BMI Score</h4>
    <p style="font-size:11px;color:var(--text3);margin-bottom:8px">Body Mass Index (kg/m²). Patient measured BMI: <strong>${(20+rng()*8).toFixed(1)}</strong> &nbsp; (Height ${(155+randInt(0,30))} cm / Weight ${(50+randInt(0,40))} kg)</p>
    <div class="must-options">
      <label><input type="radio" name="must_bmi" value="0" ${ex&&ex.bmiScore===0?'checked':''}><span>0 — BMI > 20 (>30 obese)</span></label>
      <label><input type="radio" name="must_bmi" value="1" ${ex&&ex.bmiScore===1?'checked':''}><span>1 — BMI 18.5 – 20.0</span></label>
      <label><input type="radio" name="must_bmi" value="2" ${ex&&ex.bmiScore===2?'checked':''}><span>2 — BMI < 18.5</span></label>
    </div>
  </div>`;

  /* Step 2 */
  html+=`<div class="must-step"><h4><span class="step-num">2</span>Unplanned Weight Loss (past 3-6 months)</h4>
    <div class="must-options">
      <label><input type="radio" name="must_wl" value="0" ${ex&&ex.weightLossScore===0?'checked':''}><span>0 — &lt; 5%</span></label>
      <label><input type="radio" name="must_wl" value="1" ${ex&&ex.weightLossScore===1?'checked':''}><span>1 — 5 – 10%</span></label>
      <label><input type="radio" name="must_wl" value="2" ${ex&&ex.weightLossScore===2?'checked':''}><span>2 — &gt; 10%</span></label>
    </div>
  </div>`;

  /* Step 3 */
  html+=`<div class="must-step"><h4><span class="step-num">3</span>Acute Disease Effect</h4>
    <p style="font-size:11px;color:var(--text3);margin-bottom:8px">Patient is acutely ill AND there has been or is likely to be no nutritional intake for &gt;5 days.</p>
    <div class="must-options">
      <label><input type="radio" name="must_acute" value="0" ${ex&&ex.acuteDiseaseScore===0?'checked':''}><span>0 — No</span></label>
      <label><input type="radio" name="must_acute" value="2" ${ex&&ex.acuteDiseaseScore===2?'checked':''}><span>2 — Yes</span></label>
    </div>
  </div>`;

  /* Live preview */
  html+=`<div class="card" style="background:var(--bg3);text-align:center;padding:14px">
    <div style="font-size:13px;color:var(--text3)">Calculated MUST Total</div>
    <div id="mustCalcTotal" style="font-size:32px;font-weight:700">—</div>
    <div id="mustCalcRisk">Select all 3 steps</div>
  </div>`;

  html+=`<div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn btn-primary" onclick="saveMUST()">Save MUST Assessment</button>
    <button class="btn btn-outline" onclick="backToList()">Cancel</button>
  </div></div>`;

  /* Wire live updater */
  setTimeout(()=>{
    document.querySelectorAll('input[name^="must_"]').forEach(r=>r.addEventListener('change',updateMUSTPreview));
    updateMUSTPreview();
  },50);

  return html;
}
window.updateMUSTPreview=function(){
  const b=document.querySelector('input[name="must_bmi"]:checked');
  const w=document.querySelector('input[name="must_wl"]:checked');
  const a=document.querySelector('input[name="must_acute"]:checked');
  const t=document.getElementById('mustCalcTotal');const r=document.getElementById('mustCalcRisk');
  if(!t||!r) return;
  if(b&&w&&a){
    const total=parseInt(b.value)+parseInt(w.value)+parseInt(a.value);
    const risk=total>=2?'High':total===1?'Medium':'Low';
    const cls=total>=2?'badge-danger':total===1?'badge-warn':'badge-success';
    t.textContent=total;t.style.color=total>=2?'var(--danger)':total===1?'#e65100':'var(--success)';
    r.innerHTML=`<span class="badge ${cls}" style="font-size:14px;padding:4px 16px">${risk} Risk</span>`;
  } else {t.textContent='—';t.style.color='var(--text3)';r.textContent='Select all 3 steps';}
};
window.saveMUST=function(){
  const p=S.selectedPatient;if(!p)return;const pid=String(p.id);
  const b=document.querySelector('input[name="must_bmi"]:checked');
  const w=document.querySelector('input[name="must_wl"]:checked');
  const a=document.querySelector('input[name="must_acute"]:checked');
  if(!b||!w||!a){toast('Please complete all 3 MUST steps','danger');return;}
  const bmi=parseInt(b.value),wl=parseInt(w.value),ac=parseInt(a.value);
  const total=bmi+wl+ac;const risk=total>=2?'High':total===1?'Medium':'Low';
  S.nutritionScreens[pid]={bmiScore:bmi,weightLossScore:wl,acuteDiseaseScore:ac,total,risk,
    assessedBy:'Nurse (Current)',assessedAt:dateTimeStr(new Date()),savedThisSession:true};
  S.assessmentHistory.push({type:'must',patientId:pid,bed:p.bed,name:p.name,time:S.nutritionScreens[pid].assessedAt,total,risk:risk+' Risk'});
  toast(`MUST saved: ${total} — ${risk} Risk`,'success');render();
};

/* ─── Dynamic Groups (IV Sites + Wounds) management ─── */
function renderDynGroups(){
  const p=S.selectedPatient;const pid=String(p.id);
  const sites=S.ivSites[pid]||[];const wnds=S.wounds[pid]||[];const lt=S.linesTubes[pid]||[];

  let html=`<div class="card"><div class="card-title"><i class="fa-solid fa-layer-group"></i> Dynamic Groups — Lines / Wounds / Drains</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Cerner iView dynamic groups allow multiple instances of the same data template (e.g. one row of fields per IV site or wound). Each instance gets a unique label and can be inactivated when no longer in use.</p>

    <h4 style="margin:8px 0 8px 0;color:var(--green-dark)"><i class="fa-solid fa-syringe"></i> IV Sites <button class="btn btn-info btn-sm" style="margin-left:8px" onclick="addIVSite()">+ Add IV Site</button></h4>`;
  if(sites.length===0) html+=`<p style="font-size:12px;color:var(--text3);font-style:italic">No IV sites documented.</p>`;
  sites.forEach((s,i)=>{
    html+=`<div class="dyngroup-card" style="opacity:${s.active?1:0.5}">
      <div class="dg-label">${s.label}${s.active?'':' (Inactivated)'} ${s.active?`<button class="inactivate-btn" onclick="inactivateIV(${i})">Inactivate</button>`:''}</div>
      <div class="dg-grid">
        <div class="dg-field"><label>Type</label><select onchange="S.ivSites['${pid}'][${i}].type=this.value">${IV_TYPES.map(t=>`<option ${t===s.type?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="dg-field"><label>Site</label><input value="${s.site}" onchange="S.ivSites['${pid}'][${i}].site=this.value"></div>
        <div class="dg-field"><label>Gauge</label><select onchange="S.ivSites['${pid}'][${i}].gauge=this.value">${IV_GAUGES.map(g=>`<option ${g===s.gauge?'selected':''}>${g}</option>`).join('')}</select></div>
        <div class="dg-field"><label>Inserted</label><input type="date" value="${s.inserted}" onchange="S.ivSites['${pid}'][${i}].inserted=this.value"></div>
        <div class="dg-field" style="grid-column:span 2"><label>Condition</label><input value="${s.condition}" onchange="S.ivSites['${pid}'][${i}].condition=this.value"></div>
      </div></div>`;
  });

  html+=`<h4 style="margin:18px 0 8px 0;color:var(--green-dark)"><i class="fa-solid fa-bandage"></i> Wounds <button class="btn btn-info btn-sm" style="margin-left:8px" onclick="addWound()">+ Add Wound</button></h4>`;
  if(wnds.length===0) html+=`<p style="font-size:12px;color:var(--text3);font-style:italic">No wounds documented.</p>`;
  wnds.forEach((w,i)=>{
    html+=`<div class="dyngroup-card" style="opacity:${w.active?1:0.5}">
      <div class="dg-label">${w.label}${w.active?'':' (Inactivated)'} ${w.active?`<button class="inactivate-btn" onclick="inactivateWound(${i})">Inactivate</button>`:''}</div>
      <div class="dg-grid">
        <div class="dg-field"><label>Location</label><input value="${w.location}" onchange="S.wounds['${pid}'][${i}].location=this.value"></div>
        <div class="dg-field"><label>Type</label><select onchange="S.wounds['${pid}'][${i}].type=this.value">${WOUND_TYPES.map(t=>`<option ${t===w.type?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="dg-field"><label>Size (L×W×D cm)</label><input value="${w.sizeCm}" onchange="S.wounds['${pid}'][${i}].sizeCm=this.value"></div>
        <div class="dg-field"><label>Drainage</label><select onchange="S.wounds['${pid}'][${i}].drainage=this.value">${DRAINAGE_TYPES.map(t=>`<option ${t===w.drainage?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="dg-field" style="grid-column:span 2"><label>Treatment / Dressing</label><input value="${w.treatment}" onchange="S.wounds['${pid}'][${i}].treatment=this.value"></div>
      </div></div>`;
  });

  html+=`<h4 style="margin:18px 0 8px 0;color:var(--green-dark)"><i class="fa-solid fa-link"></i> Lines / Tubes / Drains <button class="btn btn-info btn-sm" style="margin-left:8px" onclick="addLine()">+ Add</button></h4>`;
  if(lt.length===0) html+=`<p style="font-size:12px;color:var(--text3);font-style:italic">No lines / tubes / drains documented.</p>`;
  lt.forEach((l,i)=>{
    html+=`<div class="dyngroup-card" style="background:linear-gradient(to bottom right,#e1f5fe,#fff);border-color:#0288d1">
      <div class="dg-label" style="color:#01579b;border-color:#0288d1">${l.type} — ${l.location}</div>
      <div class="dg-grid">
        <div class="dg-field"><label>Status</label><input value="${l.status}" onchange="S.linesTubes['${pid}'][${i}].status=this.value"></div>
        <div class="dg-field"><label>Inserted</label><input type="date" value="${l.inserted}" onchange="S.linesTubes['${pid}'][${i}].inserted=this.value"></div>
        <div class="dg-field" style="grid-column:span 2"><label>Output / Notes</label><input value="${l.output}" onchange="S.linesTubes['${pid}'][${i}].output=this.value"></div>
      </div></div>`;
  });

  html+=`</div>`;
  return html;
}
window.addIVSite=function(){
  const pid=String(S.selectedPatient.id);
  const lbl=prompt('IV Site label (e.g. "L forearm IV #2"):','New IV site '+(S.ivSites[pid].length+1));
  if(!lbl) return;
  S.ivSites[pid].push({label:lbl,site:'',gauge:'20G',type:'Peripheral IV',inserted:dateStr(new Date()),condition:'Patent, no redness',active:true});
  toast('IV Site added','success');render();
};
window.inactivateIV=function(i){
  const pid=String(S.selectedPatient.id);
  if(!confirm('Inactivate this IV site? Document discontinuation first.')) return;
  S.ivSites[pid][i].active=false;toast('IV Site inactivated','info');render();
};
window.addWound=function(){
  const pid=String(S.selectedPatient.id);
  const lbl=prompt('Wound label:','Wound #'+(S.wounds[pid].length+1));
  if(!lbl) return;
  S.wounds[pid].push({label:lbl,location:'',type:'Pressure injury Stage I',sizeCm:'',drainage:'Serous',treatment:'',active:true});
  toast('Wound added','success');render();
};
window.inactivateWound=function(i){
  const pid=String(S.selectedPatient.id);
  if(!confirm('Inactivate this wound? Document closure / resolution first.')) return;
  S.wounds[pid][i].active=false;toast('Wound inactivated','info');render();
};
window.addLine=function(){
  const pid=String(S.selectedPatient.id);
  const t=prompt('Type (Foley / NG tube / Chest tube / JP drain / Central line ...):','Foley catheter');
  if(!t) return;
  S.linesTubes[pid].push({type:t,location:'',inserted:dateStr(new Date()),output:'',status:'In place'});
  toast('Line / Tube / Drain added','success');render();
};

/* ─── Assessment Summary Dashboard ─── */
function renderDashboard(){
 let html=`<h2 style="font-size:20px;margin-bottom:20px"><i class="fa-solid fa-chart-bar"></i> Assessment Summary Dashboard</h2>`;

  /* Stats bar */
  const totalPatients=S.patients.length;
  const bradenDone=S.patients.filter(p=>S.bradenScores[String(p.id)]!==null).length;
  const morseDone=S.patients.filter(p=>S.morseScores[String(p.id)]!==null).length;
  const painDone=S.patients.filter(p=>S.painAssessments[String(p.id)]!==null).length;
  const gcsDone=S.patients.filter(p=>S.gcsScores[String(p.id)]!==null).length;
  const overdueCount=S.overdueAssessments.length;

  html+=`<div class="stats-bar">
    <div class="stat-item"><div class="stat-val">${totalPatients}</div><div class="stat-label">Total Patients</div></div>
    <div class="stat-item"><div class="stat-val">${bradenDone}/${totalPatients}</div><div class="stat-label">Braden Done</div></div>
    <div class="stat-item"><div class="stat-val">${morseDone}/${totalPatients}</div><div class="stat-label">Morse Done</div></div>
    <div class="stat-item"><div class="stat-val">${painDone}/${totalPatients}</div><div class="stat-label">Pain Done</div></div>
    <div class="stat-item"><div class="stat-val">${gcsDone}/${totalPatients}</div><div class="stat-label">GCS Done</div></div>
    <div class="stat-item" style="border-color:${overdueCount>0?'var(--danger)':'var(--border2)'}"><div class="stat-val" style="color:${overdueCount>0?'var(--danger)':'var(--success)'}">${overdueCount}</div><div class="stat-label">Overdue</div></div>
  </div>`;

  /* Matrix view */
 html+=`<div class="card"><div class="card-title">Assessment Matrix</div>
    <table class="matrix-table"><thead><tr><th>Bed</th><th>Patient</th><th>Braden</th><th>Morse</th><th>Pain NRS</th><th>GCS</th><th>Alerts</th></tr></thead><tbody>`;

  S.patients.forEach(p=>{
    const pid=String(p.id);
    const bs=S.bradenScores[pid];
    const ms=S.morseScores[pid];
    const pa=S.painAssessments[pid];
    const gs=S.gcsScores[pid];
    const overdue=S.overdueAssessments.filter(o=>o.patientId==p.id||o.bed===p.bed);

    /* Braden cell */
    let bradenCell='<td class="'+(overdue.some(o=>o.type==='braden')?'overdue':'')+'">'; 
    if(bs){const t=bradenTotal(bs);const r=bradenRisk(t);bradenCell+=`<span class="badge ${r.cls}">${t}</span>`;}
    else bradenCell+='<span style="color:var(--text3)">—</span>';
    bradenCell+='</td>';

    /* Morse cell */
    let morseCell='<td class="'+(overdue.some(o=>o.type==='morse')?'overdue':'')+'">'; 
    if(ms){const t=morseTotal(ms);const r=morseRisk(t);morseCell+=`<span class="badge ${r.cls}">${t}</span>`;}
    else morseCell+='<span style="color:var(--text3)">—</span>';
    morseCell+='</td>';

    /* Pain cell */
    let painCell='<td class="'+(overdue.some(o=>o.type==='pain')?'overdue':'')+'">'; 
    if(pa){const r=painLevel(pa.score);painCell+=`<span class="badge ${r.cls}">${pa.score}/10</span>`;}
    else painCell+='<span style="color:var(--text3)">—</span>';
    painCell+='</td>';

    /* GCS cell */
    let gcsCell='<td class="'+(overdue.some(o=>o.type==='gcs')?'overdue':'')+'">'; 
    if(gs){const t=gcsTotal(gs);const r=gcsLevel(t);gcsCell+=`<span class="badge ${r.cls}">${t}/15</span>`;}
    else gcsCell+='<span style="color:var(--text3)">—</span>';
    gcsCell+='</td>';

    /* Alerts */
    let alerts=[];
    if(overdue.length>0) alerts.push(`<span style="color:var(--danger)">🔴 ${overdue.length} overdue</span>`);
    if(bs&&bradenTotal(bs)<=12) alerts.push('<span style="color:var(--danger)">Pressure ulcer risk</span>');
    if(ms&&morseTotal(ms)>=45) alerts.push('<span style="color:var(--danger)">High fall risk</span>');
    if(pa&&pa.score>=7) alerts.push('<span style="color:var(--danger)">Severe pain</span>');
    if(gs&&gcsTotal(gs)<=8) alerts.push('<span style="color:var(--danger)">Severe brain injury</span>');
    if(p.fallHistory) alerts.push('<span style="color:#e65100">Fall history</span>');

    /* Check interventions for high-risk Braden */
    if(bs&&bradenTotal(bs)<=12){
      const intv=S.interventionsPlanned[pid]||[];
      if(intv.length===0) alerts.push('<span style="color:var(--danger);font-weight:700">⚠️ NO INTERVENTION PLAN</span>');
    }

    html+=`<tr style="cursor:pointer" onclick="selectPatient(${p.bed})">
      <td><strong>${p.bed}</strong></td><td>${p.name}</td>
      ${bradenCell}${morseCell}${painCell}${gcsCell}
      <td style="font-size:11px">${alerts.join('<br>')||'<span style="color:var(--success)">✓ OK</span>'}</td>
    </tr>`;
  });

  html+=`</tbody></table></div>`;

  /* Overdue assessments detail */
  if(S.overdueAssessments.length>0){
    html+=`<div class="card" style="border-color:var(--danger)"><div class="card-title" style="color:var(--danger)">⚠️ Overdue Assessments</div>
      <table><thead><tr><th>Bed</th><th>Patient</th><th>Type</th><th>Due</th><th>Reason</th></tr></thead><tbody>`;
    S.overdueAssessments.forEach(o=>{
      html+=`<tr class="overdue"><td>${o.bed}</td><td>${o.name}</td><td>${o.type.toUpperCase()}</td><td>${o.dueAt}</td><td>${o.reason}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  }

  /* Recent assessment history */
  if(S.assessmentHistory.length>0){
    html+=`<div class="card"><div class="card-title">📜 Recent Assessment History</div>
      <table><thead><tr><th>Time</th><th>Bed</th><th>Patient</th><th>Type</th><th>Score</th><th>Risk</th></tr></thead><tbody>`;
    S.assessmentHistory.slice().reverse().forEach(h=>{
      html+=`<tr><td>${h.time}</td><td>${h.bed}</td><td>${h.name}</td><td>${h.type.toUpperCase()}</td><td>${h.total}</td><td>${h.risk}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  }

  return html;
}

/* ─── Auto-init with default seed if not called externally ─── */
if (!window._medgym_init_called) {
  window._medgym_init(42);
  window._medgym_init_called = true;
}

/* ─── Clock ─── */
setInterval(()=>{
  const el=document.getElementById('headerClock');
  if(el)el.textContent=new Date().toLocaleTimeString();
},1000);

/* ─── Keyboard shortcuts ─── */
document.addEventListener('keydown',function(e){
  if(!S.loggedIn)return;
  if(e.altKey){
    switch(e.key){
      case '1': e.preventDefault(); showPage('patientList'); break;
      case '2': e.preventDefault(); if(S.selectedPatient)showPage('braden'); break;
      case '3': e.preventDefault(); if(S.selectedPatient)showPage('morse'); break;
      case '4': e.preventDefault(); if(S.selectedPatient)showPage('pain'); break;
      case '5': e.preventDefault(); if(S.selectedPatient)showPage('gcs'); break;
      case '6': e.preventDefault(); showPage('dashboard'); break;
    }
  }
  if(e.key==='Escape') closeModal();
});

})();
